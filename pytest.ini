[pytest]
markers =
    deep: marks tests as slow
    failing: marks tests as known no passing
DJANGO_SETTINGS_MODULE = sefaria.settings

; This config lives at the repo root: pytest resolves rootdir to the directory holding
; this file, and only suites below rootdir are collectable — from here that includes
; sefaria/, reader/ and the other suites listed. Patterns are matched against the tail
; of each file's path, so they hold regardless of which directories are passed on the
; command line.
python_files =
    sefaria/tests/*_test.py
    sefaria/system/tests/*_test.py
    sefaria/model/tests/*_test.py
    sefaria/helper/tests/*_test.py
    sefaria/datatype/tests/*_test.py
    remote_config/tests/*_test.py
    reader/tests/*_test.py
    reader/tests/test_*.py
    sso/tests/*_test.py
    semantic_search/tests/*_test.py

