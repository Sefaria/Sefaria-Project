# A private copy of the stack's gateway half for the stack scenario scripts (failure drills, registry guards,
# migrations). It has its own Postgres, so drills never disturb the shared stack. Run through scenarios/lib.sh.
name: sefaria-apikeys-d11

x-authsvc: &authsvc
  image: ${D11_AUTHSVC_IMAGE:-sefaria-apikeys-stack-authsvc:local}
  environment:
    HTTP_ADDR: ":8080"
    GRPC_ADDR: ":9090"
    AUTH_MODE: ${AUTH_MODE:-enforce}
    GATED_PATHS: ${GATED_PATHS:-/api/knn-search}
    HELP_URL: ${HELP_URL:-https://developers.sefaria.org/#}
    RELOAD_INTERVAL: ${RELOAD_INTERVAL:-60s}
    PG_NOTIFY_CHANNEL: ${PG_NOTIFY_CHANNEL-sefaria_apikeys}
    PG_DSN: ${PG_DSN:-postgres://auth_service_reader:reader@pg:5432/sefaria_auth?sslmode=disable}
  read_only: true
  depends_on:
    pg: { condition: service_healthy }

services:
  pg:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sefaria_auth
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sefaria_auth"]
      interval: 2s
      retries: 30

  authsvc:
    <<: *authsvc
    ports: ["127.0.0.1:28080:8080", "127.0.0.1:29090:9090"]

  # Second replica, for the rolling-restart drill only.
  authsvc_b:
    <<: *authsvc
    profiles: [two]
    ports: ["127.0.0.1:28081:8080"]

  echo:
    image: ealen/echo-server:0.9.2
    environment: { PORT: "8080", LOGS__LEVEL: fatal }

  envoy:
    image: envoyproxy/envoy:v1.39.1
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ${D11_RUN_DIR:?run through scenarios/lib.sh}/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:20080:10080"
      - "127.0.0.1:20082:10082"
      - "127.0.0.1:20083:10083"
      - "127.0.0.1:29000:19000"
    depends_on: [echo]

volumes:
  pgdata:
