# The new reader client (reader-next/): every change is type-checked and tested before it lands (CODE_REVIEW §3.1).
# Unit, architecture and component (Storybook) tests, in English/LTR and Hebrew/RTL; then the end-to-end suite against the API
# cassette (scripts/api-cassette.mjs): the bundle pinned by e2e/cassette.lock, replayed (scripts/cassette/bundle.mjs); without one, the
# CI cache, recording anything missing from the live API. A budgets job holds the reader page's initial JS/CSS (scripts/budgets/).
# The exits job (push and manual runs only) lists the links that still lead out to the legacy client (scripts/exits-crawl.mjs), as
# an artifact; report-only until wave 2 has ported what it names (LAUNCH_PLAN §5 F), then it becomes a gate.
name: reader-next client

on:
  pull_request:
    branches: [reader-next]
    paths: ["reader-next/**", ".github/workflows/reader-next-client.yaml", "build/ci/reader-nginx-paths.mjs", "helm-chart/sefaria/templates/_reader-django-paths.tpl"]
  push:
    branches: [reader-next]
    paths: ["reader-next/**", ".github/workflows/reader-next-client.yaml", "build/ci/reader-nginx-paths.mjs", "helm-chart/sefaria/templates/_reader-django-paths.tpl"]
  workflow_dispatch:

concurrency:
  group: reader-next-client-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: reader-next

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader-next/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit and architecture tests
        run: npm test
      - name: Atlas tags exist
        run: npm run features:coverage -- --unknown
      - name: nginx's Django paths match DJANGO_PREFIXES (helm-chart/sefaria/templates/_reader-django-paths.tpl)
        run: node --experimental-strip-types ../build/ci/reader-nginx-paths.mjs --check
      - name: Cassette bundle and budget scripts
        run: node --test scripts/cassette/*.test.mjs scripts/budgets/*.test.mjs
      - name: Component tests (English, LTR)
        run: npm run test:stories
      - name: Component tests (Hebrew, RTL)
        run: npm run test:stories:hebrew
      - name: Component tests (dark theme)
        run: npm run test:stories:dark

  # LAUNCH_PLAN T-H04: the reader page's initial JS and CSS (scripts/budgets/measure.mjs) against scripts/budgets/baseline.json
  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader-next/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Initial JS/CSS of the reader page within the baseline
        run: node scripts/budgets/measure.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader-next/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The pinned recordings (e2e/cassette.lock → a release asset, scripts/cassette/bundle.mjs): replayed, never the network. Without
      # a lock the step warns and CI keeps the cache + auto behaviour below; with one, a bundle that cannot be used fails a push and
      # warns (then falls back) on a pull request.
      - name: Fetch the pinned API cassette
        id: cassette
        run: node scripts/cassette/bundle.mjs fetch ${{ github.event_name == 'push' && '--strict' || '' }}
      - name: Restore the API cassette (fallback)
        if: steps.cassette.outputs.mode != 'replay'
        uses: actions/cache@v4
        with:
          path: reader-next/e2e/.cassette
          key: e2e-cassette-${{ hashFiles('reader-next/e2e/**/*.ts') }}
          restore-keys: e2e-cassette-
      - name: End-to-end (desktop, API cassette ${{ steps.cassette.outputs.mode }})
        run: npx playwright test --project=desktop
        env:
          CI: "1"
          E2E_API_MODE: ${{ steps.cassette.outputs.mode }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: reader-next/test-results
          retention-days: 7

  # T-F01 (owner rule 2026-11-05: no way out to the legacy client): crawl the reader's page types (desktop and phone, signed out and
  # in) through a read-only stand-in for Django in front of www.sefaria.org, and list every same-site link Django answers that is not
  # in scripts/exits-allowlist.json. Report-only: it never fails on the list (only on a crawl that could not run); the list is the
  # artifact "exits" (exits.json, exits.md) and the job summary. Not on pull requests: it reads the live site for ~45 minutes.
  exits:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader-next/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Ways out to the legacy client (report only)
        run: node scripts/exits-crawl.mjs --report-only --out exits.json --md exits.md
      - name: Summary
        if: always()
        run: if [ -f exits.md ]; then cat exits.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exits
          path: |
            reader-next/exits.json
            reader-next/exits.md
          if-no-files-found: warn
          retention-days: 30
