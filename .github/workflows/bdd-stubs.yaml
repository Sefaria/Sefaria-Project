name: BDD step stubs
# When product hands off a behavior spec (a push that changes e2e-tests/feature-specs/features/),
# write a step-definition stub for every sentence that has no step yet, and commit the stubs back
# to the same branch. The engineer pulls a branch where generation passes and each new scenario
# fails with "Step not implemented yet": the "red" starting point. Also runs when a spec editor
# amends a spec, so new sentences get stubs too.
# Logic: build/ci/bdd-stubs/. Process: e2e-tests/feature-specs/README.md.
#
# The bot commit only touches e2e-tests/feature-specs/steps/, which the Feature Spec Lock does not
# lock. A push made with GITHUB_TOKEN does not trigger other workflows, so if a PR is already open
# its CI runs again on the engineer's next push, not on the stub commit.
on:
  push:
    branches-ignore: [master]
    paths:
      - 'e2e-tests/feature-specs/features/**'

permissions:
  contents: write

concurrency:
  group: bdd-stubs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stubs:
    name: "BDD step stubs"
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'
      - name: Generate stubs for missing steps
        run: |
          node build/ci/bdd-stubs/generate-step-stubs.cjs | tee stub-output.txt
          { echo '### BDD step stubs'; echo '```'; cat stub-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm stub-output.txt
      - name: Commit stubs to the branch
        run: |
          git add e2e-tests/feature-specs/steps
          if git diff --cached --quiet; then
            echo "No new stubs."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-verify -m "test(bdd): step stubs for new spec sentences [generated]" \
            -m "Generated by .github/workflows/bdd-stubs.yaml from ${GITHUB_SHA::10}. Each stub throws until an engineer implements it."
          git pull --rebase --no-edit origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice::Committed step stubs to ${GITHUB_REF_NAME}. Pull before you start on the steps."
