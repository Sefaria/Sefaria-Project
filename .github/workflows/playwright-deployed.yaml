name: Playwright (deployed environment)

# Run the e2e suite from a chosen BRANCH against an already-deployed
# ENVIRONMENT (staging / preprod / prod). This is deliberately separate from
# integration-testing.yaml, which builds a throwaway sandbox from the merge
# commit and tests that — here nothing is built or deployed, we only point the
# tests at a live site.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch (or tag / SHA) to take the tests from'
        required: true
        default: 'master'
        type: string
      # NOTE: the suite is not read-only. It logs in as the QA accounts and
      # mutates their state — sheet-lifecycle (SHT-001..010) creates and deletes
      # a real sheet, the bookmark suites toggle real /saved entries, and UMN-007
      # performs a real logout. Choosing `prod` means those act on production
      # under the QA accounts.
      target:
        description: 'Deployed environment to run the tests against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - preprod
          - prod
      suite:
        description: 'How much to run — see the table in the job summary'
        required: true
        default: 'sanity'
        type: choice
        options:
          - sanity          # @sanity release gate, all 3 desktop browsers + mobile
          - sanity-chrome   # @sanity release gate, Chromium only (fastest signal)
          - desktop-chrome  # every desktop suite, Chromium only
          - mobile          # mobile-web config only (Pixel 5 + iPhone 13)
          - everything      # all 33 desktop projects x 3 browsers, plus mobile
      timeout_multiplier:
        description: 'TIMEOUT_MULTIPLIER (0.1-3.0). Raise it if the target is slow.'
        required: false
        default: '1.5'
        type: string

# The suite logs in as shared QA accounts and mutates their server-side state
# (bookmarks, sheets, and a real logout in UMN-007). Two runs against the same
# environment would fight over those accounts, so serialise per target.
concurrency:
  group: playwright-deployed-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  playwright:
    name: "Playwright — ${{ inputs.suite }} @ ${{ inputs.target }}"
    runs-on: ubuntu-latest
    # playwright.config.ts pins `workers: 1` under CI, so wall-clock scales with
    # test count: ~1,575 desktop tests for `everything` versus ~130 for a sanity
    # leg. Give the full run a much larger budget.
    timeout-minutes: ${{ inputs.suite == 'everything' && 360 || 120 }}
    steps:
      - name: Checkout the branch under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve target environment
        id: target
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            staging)
              echo "url=https://www.sefariastaging.org"       >> "$GITHUB_OUTPUT"
              echo "url_il=https://www.sefariastaging-il.org"  >> "$GITHUB_OUTPUT"
              ;;
            preprod)
              echo "url=https://www.sefariapreprod.org"        >> "$GITHUB_OUTPUT"
              echo "url_il=https://www.sefariapreprod-il.org"  >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "url=https://www.sefaria.org"               >> "$GITHUB_OUTPUT"
              echo "url_il=https://www.sefaria.org.il"         >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown target '${{ inputs.target }}'"
              exit 1
              ;;
          esac

      # playwright.config.ts and e2e-tests/constants.ts both derive the module
      # hosts as `https://www.<domain>` / `https://voices.<domain>` (and
      # `chiburim.<domain>` for Hebrew Voices) after stripping a leading `www.`,
      # so the values above are written in the `www.` form the tests expect and
      # must carry no path. Prod Hebrew is sefaria.org.il — a two-level public
      # suffix that fixCookieDomainsForCrossSubdomain already special-cases.
      - name: Check the target is reachable
        run: |
          set -euo pipefail
          for url in "${{ steps.target.outputs.url }}/texts" "${{ steps.target.outputs.url_il }}/texts"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::$url returned $code — refusing to run against an unhealthy target"; exit 1; }
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        id: run
        env:
          SANDBOX_URL: ${{ steps.target.outputs.url }}
          SANDBOX_URL_IL: ${{ steps.target.outputs.url_il }}
          TIMEOUT_MULTIPLIER: ${{ inputs.timeout_multiplier }}
          GENERATE_REPORTS: '1'
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
          PLAYWRIGHT_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
          PLAYWRIGHT_SUPERUSER_EMAIL: ${{ secrets.PLAYWRIGHT_SUPERUSER_EMAIL }}
          PLAYWRIGHT_SUPERUSER_PASSWORD: ${{ secrets.PLAYWRIGHT_SUPERUSER_PASSWORD }}
          # Library Assistant accounts. If these secrets are unset, global-setup
          # skips those profiles with an explicit SKIPPED line and only the
          # assistant suites fail — everything else still runs.
          PLAYWRIGHT_LA_USER_EMAIL: ${{ secrets.PLAYWRIGHT_LA_USER_EMAIL }}
          PLAYWRIGHT_LA_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_LA_USER_PASSWORD }}
          PLAYWRIGHT_LA_USER_HE_EMAIL: ${{ secrets.PLAYWRIGHT_LA_USER_HE_EMAIL }}
          PLAYWRIGHT_LA_USER_HE_PASSWORD: ${{ secrets.PLAYWRIGHT_LA_USER_HE_PASSWORD }}
        run: |
          set -uo pipefail
          mkdir -p reports
          overall=0

          # Each leg is its own `playwright test` invocation so that a failure in
          # one browser still lets the rest report. The legs run SEQUENTIALLY on
          # purpose: UMN-007 performs a real UI logout of the shared admin
          # account, which destroys the server-side session every other
          # concurrently-running browser is reading from disk (see
          # e2e-tests/CLAUDE.md rule 2.21). Running the browsers in parallel
          # makes UMN-007 and its neighbours fail for reasons that have nothing
          # to do with the code under test.
          run_leg () {
            local label="$1"; shift
            echo "::group::playwright $label"
            npx playwright test "$@"
            local rc=$?
            echo "::endgroup::"
            [ $rc -eq 0 ] || overall=1
            # The html/junit paths are fixed in the configs, so archive each
            # leg's report before the next invocation overwrites it.
            for d in e2e-tests/e2e-test-logs/html-report e2e-tests/e2e-test-logs/html-report-mobile; do
              [ -d "$d" ] && mv "$d" "reports/${label}-html" && break
            done
            for f in e2e-tests/e2e-test-logs/junit-results.xml e2e-tests/e2e-test-logs/junit-results-mobile.xml; do
              [ -f "$f" ] && mv "$f" "reports/${label}-junit.xml" && break
            done
            echo "$label: $([ $rc -eq 0 ] && echo PASSED || echo FAILED)" >> reports/summary.txt
            return 0
          }

          MOBILE=(--config=playwright.mobileweb.config.ts)

          case "${{ inputs.suite }}" in
            sanity)
              run_leg chrome-sanity  --project=chrome-sanity
              run_leg firefox-sanity --project=firefox-sanity
              run_leg safari-sanity  --project=safari-sanity
              run_leg mobile-sanity  "${MOBILE[@]}" --project=mobile-sanity
              ;;
            sanity-chrome)
              run_leg chrome-sanity  --project=chrome-sanity
              run_leg mobile-sanity  "${MOBILE[@]}" --project=mobile-sanity
              ;;
            desktop-chrome)
              run_leg desktop-chrome \
                --project=chrome-library \
                --project=chrome-voices \
                --project=chrome-misc \
                --project=chrome-assistant \
                --project=chrome-resource-panel \
                --project=chrome-voices-topics \
                --project=chrome-library-topics \
                --project='chrome-bookmarks-(saved)-and-history' \
                --project=chrome-search \
                --project=chrome-user-menu \
                --project=chrome-cross-module
              ;;
            mobile)
              run_leg mobile "${MOBILE[@]}"
              ;;
            everything)
              run_leg desktop-all
              run_leg mobile-all "${MOBILE[@]}"
              ;;
            *)
              echo "::error::Unknown suite '${{ inputs.suite }}'"
              exit 1
              ;;
          esac

          {
            echo "### Playwright — \`${{ inputs.suite }}\` on \`${{ inputs.target }}\`"
            echo ""
            echo "Branch: \`${{ inputs.branch }}\`  ·  Library: ${{ steps.target.outputs.url }}  ·  Hebrew: ${{ steps.target.outputs.url_il }}"
            echo ""
            echo '```'
            cat reports/summary.txt 2>/dev/null || echo "(no legs ran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $overall

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ inputs.suite }}-${{ inputs.target }}-${{ github.run_id }}
          path: |
            reports/
            e2e-tests/e2e-test-logs/test-results/
          retention-days: 30
          if-no-files-found: warn
