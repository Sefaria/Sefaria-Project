name: Helm

on:
  push:
    branches-ignore:
      - master
      - prod
      - preprod
    paths:
      - "helm-chart/**"
      - ".github/workflows/helm.yaml"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
      - name: Set up Python
        uses: actions/setup-python@v2
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.2.1
        with:
          version: v3.5.1
      - name: Lint chart
        run: ct lint --charts helm-chart/sefaria

  chart:
    name: Release Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to write releases
      id-token: write # needed to authenticate to GAR for the OCI chart push
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # Fetch entire history. Required for chart-releaser; see https://github.com/helm/chart-releaser-action/issues/13#issuecomment-602063896
          fetch-depth: 0
      - name: fetch head of branch to ensure semantic can run
        run: git pull origin $GITHUB_REF
      - name: create release rules
        run: helm-chart/release-rules.sh 
      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          working_directory: ./helm-chart
          semantic_version: 18.0.1 
          extra_plugins: |
            conventional-changelog-conventionalcommits@6.1.0
            semantic-release-monorepo@7.0.5
            @semantic-release/commit-analyzer@9.0.2
          extends: |
            semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup
        shell: bash
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Get appVersion
        id: appVersion
        run: |
          echo "appVersion=$(git describe --match 'v*' --abbrev=0 HEAD --tags)" >> $GITHUB_OUTPUT
      - name: Get chartVersion
        id: chartVersion
        run: |
          if [[ -z "${{ steps.semantic.outputs.new_release_version }}" ]]; then
            if [[ -z "$(git tag --points-at HEAD -l 'helm*')" ]]; then
              echo "No chart version available"
              exit 1
            else
              echo "chartVersion=$(git tag --points-at HEAD -l 'helm*' | sed 's/helm-chart-//' )" >> $GITHUB_OUTPUT
            fi
          else
            echo "chartVersion=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          fi
      - name: Download yq
        run: |
          wget -nv -nc -O yq https://github.com/mikefarah/yq/releases/download/v4.20.2/yq_linux_amd64
          chmod +x yq
      - name: Update chart version
        run: ./yq -i e '.version = "${{ steps.chartVersion.outputs.chartVersion }}"' helm-chart/sefaria/Chart.yaml
      - name: Update chart appVersion
        run: ./yq -i e '.appVersion = "${{ steps.appVersion.outputs.appVersion }}"' helm-chart/sefaria/Chart.yaml
      - name: Publish Helm charts
        uses: stefanprodan/helm-gh-pages@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          chart_version: ${{ steps.semantic.outputs.new_release_version }}
          app_version: ${{ steps.appVersion.outputs.appVersion }}
          charts_dir: helm-chart
      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.PROD_GKE_PROJECT_ID }}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.PROD_GKE_SA }}'
      - name: Publish Helm chart to GAR (OCI)
        env:
          OCI_REPO: us-east1-docker.pkg.dev/${{ secrets.PROD_GKE_PROJECT }}/containers
          CHART_VERSION: ${{ steps.chartVersion.outputs.chartVersion }}
        run: |
          helm registry login us-east1-docker.pkg.dev \
            -u oauth2accesstoken -p '${{ steps.auth.outputs.access_token }}'
          helm package helm-chart/sefaria --destination dist
          helm push "dist/sefaria-${CHART_VERSION}.tgz" "oci://${OCI_REPO}"
