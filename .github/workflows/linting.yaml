name: Linting

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches-ignore:
      - preprod
      - prod

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-pin:
    name: "Design system is pinned to a release"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the base branch, to compare versions
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: node build/ci/check-design-system-pin.mjs
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event_name == 'pull_request' && 'FETCH_HEAD' || '' }}

  lint-python:
    name: "Lint: Python (Ruff)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      # Pin Ruff to the version in requirements.txt. Without `version:` the action cannot parse one from
      # pyproject.toml and silently installs the LATEST Ruff, so CI can disagree with local runs.
      # When bumping Ruff, change it here AND in requirements.txt.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"
          args: "format --check"

  lint-js:
    name: "Lint: JavaScript (ESLint)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run ESLint
        run: npx eslint 'static/js/**/*.{js,jsx}' --max-warnings=0

  lint-css:
    name: "Lint: CSS/SCSS (Stylelint)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Stylelint
        run: npx stylelint 'static/css/**/*.scss' --max-warnings=0

  lint-format:
    name: "Lint: Formatting (Prettier)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npx prettier --check 'static/js/**/*.{js,jsx}' 'static/css/**/*.scss' '**/*.md' --ignore-path .prettierignore

  lint-devportal:
    name: "Lint: developer portal (ESLint, Stylelint, Prettier)"
    # devportal-ui/ is its own npm package with its own lockfile and lint configs.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: devportal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devportal-ui/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: ESLint and Stylelint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
