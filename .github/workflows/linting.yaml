name: Linting

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches-ignore:
      - preprod
      - prod

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: "Lint: Python (Ruff)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  lint-js:
    name: "Lint: JavaScript (ESLint)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run ESLint
        run: npx eslint 'static/js/**/*.{js,jsx}' --max-warnings=0

  lint-css:
    name: "Lint: CSS/SCSS (Stylelint)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Stylelint
        run: npx stylelint 'static/css/**/*.scss' --max-warnings=0

  lint-format:
    name: "Lint: Formatting (Prettier)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npx prettier --check 'static/js/**/*.{js,jsx}' 'static/css/**/*.scss' '**/*.md' --ignore-path .prettierignore
