name: "Back-merge"

# Carries hotfixes back down the chain so environments don't diverge:
#   prod    → preprod   (after a break-glass hotfix/* → prod)
#   preprod → master    (after hotfix/* → preprod, or after the prod → preprod leg)
#
# Runs after "Deploy Static Environment" finishes on prod/preprod — i.e. after the
# deploy bot has committed its version bump — so the back-merge never captures a
# half-deployed branch. Forward promotions produce only deploy bumps on the
# source, which back-merge.sh ignores, so it is a no-op for them.
#
# The PR head is a frozen backmerge/<source>-into-<target> branch that already
# holds a real merge commit, and auto-merge is enabled with the merge-commit
# method. A squash would drop the ancestry link and make the next forward
# promotion conflict on envs/<env>/helmrelease.yaml and promotions/<env>
# (#3728 → #3739). A reviewer still has to approve; GitHub then merges it.
#
# Requires the repo setting "Allow auto-merge". Uses BYPASS_BRANCH_PROTECTION_TOKEN
# (already able to push — deploy-static.yaml's update-deployment-state pushes
# with it) to push the backmerge/* branch, open the PR and enable auto-merge;
# a PAT rather than GITHUB_TOKEN is what makes the PR's required checks run.
#
# Auto-merge makes a squash unlikely, not impossible: a reviewer can still click
# "Squash and merge" before it fires. Approve and let it merge.

on:
  workflow_run:
    workflows: ["Deploy Static Environment"]
    types: [completed]
    branches: [prod, preprod]
  workflow_dispatch:
    inputs:
      source:
        description: "Branch to back-merge from (prod → preprod, preprod → master)"
        required: true
        type: choice
        options:
          - prod
          - preprod

concurrency:
  group: back-merge-${{ github.event.workflow_run.head_branch || inputs.source }}
  cancel-in-progress: false

jobs:
  back-merge:
    name: "Back-merge: ${{ github.event.workflow_run.head_branch || inputs.source }}"
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve path
        id: path
        env:
          SOURCE: ${{ github.event.workflow_run.head_branch || inputs.source }}
        run: |
          case "$SOURCE" in
            prod)    TARGET=preprod ;;
            preprod) TARGET=master ;;
            *) echo "❌ No back-merge path from '${SOURCE}'"; exit 1 ;;
          esac
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "branch=backmerge/${SOURCE}-into-${TARGET}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BYPASS_BRANCH_PROTECTION_TOKEN }}

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build merge commit
        id: merge
        env:
          SOURCE: ${{ steps.path.outputs.source }}
          TARGET: ${{ steps.path.outputs.target }}
          BRANCH: ${{ steps.path.outputs.branch }}
        run: ./build/ci/back-merge.sh "$SOURCE" "$TARGET" "$BRANCH"

      - name: Push branch, open PR, enable auto-merge
        if: steps.merge.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.BYPASS_BRANCH_PROTECTION_TOKEN }}
          SOURCE: ${{ steps.path.outputs.source }}
          TARGET: ${{ steps.path.outputs.target }}
          BRANCH: ${{ steps.path.outputs.branch }}
          COMMITS: ${{ steps.merge.outputs.commits }}
        run: |
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          PR_URL=$(gh pr list --base "$TARGET" --head "$BRANCH" --state open \
            --json url --jq '.[0].url // empty')

          if [[ -z "$PR_URL" ]]; then
            PR_BODY=$(mktemp)
            {
              echo "## Back-merge \`${SOURCE}\` → \`${TARGET}\`"
              echo ""
              echo "> [!IMPORTANT]"
              echo "> Auto-merge is set to **merge commit**. Approve and let it merge — do not squash or rebase."
              echo "> A squash drops the ancestry link and makes the next forward promotion conflict."
              echo ""
              echo "### Commits on \`${SOURCE}\` missing from \`${TARGET}\`"
              echo ""
              echo "$COMMITS" | sed 's/^/- /'
              echo ""
              echo "---"
              echo "_Auto-generated by the Back-merge workflow_"
            } > "$PR_BODY"
            PR_URL=$(gh pr create --base "$TARGET" --head "$BRANCH" \
              --title "Back-merge ${SOURCE} → ${TARGET} (merge commit only)" \
              --body-file "$PR_BODY")
          else
            echo "Updated existing PR: ${PR_URL}"
          fi

          gh pr merge "$PR_URL" --auto --merge
          echo "✅ ${PR_URL} — auto-merge (merge commit) enabled" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to do
        if: steps.merge.outputs.pending != 'true'
        run: echo "No commits to back-merge from ${{ steps.path.outputs.source }}." >> "$GITHUB_STEP_SUMMARY"
