name: Continuous
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches-ignore:
      - preprod
      - prod
    paths-ignore:
      - "docs/**"
  merge_group:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-generic:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: "Continuous Image Build"
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ web, node, auth-service ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-${{ matrix.app }}-${{ steps.branch-name.outputs.current_branch }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,enable=true,priority=100,prefix=sha-,suffix=-${{ steps.date.outputs.date }},format=short
            type=sha
          flavor: |
            latest=true
      - name: build and push
        uses: docker/build-push-action@v6
        with:
#         cache-from: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache
#         cache-to: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache, mode=max
          context: .
          push: true
          build-args: |
            TYPE=build
          file: ./build/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-derived:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: "Continuous Image Build Stage 2"
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs:
      - build-generic
    strategy:
      matrix:
        app: [ asset ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-${{ matrix.app }}-${{ steps.branch-name.outputs.current_branch }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,enable=true,priority=100,prefix=sha-,suffix=-${{ steps.date.outputs.date }},format=short
            type=sha
          flavor: |
            latest=true
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: build and push
        uses: docker/build-push-action@v6
        with:
#         cache-from: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache
#         cache-to: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache,mode=max
          context: .
          push: true
          build-args: |
            SRC_IMG=us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-web-${{ steps.branch-name.outputs.current_branch }}:sha-${{ steps.get-sha.outputs.sha_short }}
          file: ./build/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
#######
# Below Tests only run if PR is NOT draft
#######
  jest-tests:
    name: "Continuous Testing: Jest"   # This name is referenced when slacking status
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          npm install
          npm run build-prod
      - run: ls
      - run: pwd
      - name: Run Jest Tests
        run: npm run jest-gha
      - name: Handle Jest Test Results
        run: cat /home/runner/jestResults.json; STATUS=`jq ".numFailedTestSuites" /home/runner/jestResults.json`; exit $STATUS
        if: ${{ always() }}
  auth-service-tests:
    name: "Continuous Testing: auth-service Go"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for auth-service changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth_service:
              - 'auth-service/**'
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.auth_service == 'true'
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - name: go vet and race tests (Postgres tests included)
        if: steps.changes.outputs.auth_service == 'true'
        working-directory: auth-service
        env:
          PG_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go vet ./...
          go test -race -count=1 ./...
  devportal-ui:
    name: "Continuous Testing: devportal-ui"
    # The developer portal's frontend package (Vite + React 19 + TypeScript), which has its
    # own package.json and lockfile. Needs no sandbox.
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 20
    defaults:
      run:
        working-directory: devportal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devportal-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
        env:
          CI: "true"
      - name: Production build
        run: npm run build
  devportal-pure:
    name: "Continuous Testing: devportal pure"
    # Tests of the developer portal that need no Django and no database: devportal/tests/pure,
    # the cross-language goldens, the editor round-trip corpus and MCP conformance.
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devportal-ui/package-lock.json
      - name: Install the portal's pure Python dependencies
        # The Markdown and sanitizer pins are read from requirements.txt so they cannot drift
        # from production. pytest matches requirements.txt; jsonschema is test-only.
        run: |
          set -euo pipefail
          pins=()
          for pkg in markdown-it-py linkify-it-py nh3; do
            pin="$(grep -iE "^${pkg}(\[[^]]*\])?==" requirements.txt || true)"
            if [ -z "$pin" ]; then
              echo "::error file=requirements.txt::${pkg} must be pinned with == in requirements.txt"
              exit 1
            fi
            pins+=("$pin")
          done
          python -m pip install --upgrade pip
          python -m pip install "${pins[@]}" pytest==7.4.4 jsonschema==4.26.0
      - name: Install devportal-ui dependencies
        working-directory: devportal-ui
        run: npm ci
      - name: Editor round-trip corpus (RT-2 inputs)
        # Placeholder until W13 lands the script: skipped while devportal-ui has no such npm script.
        run: |
          if jq -e '.scripts["roundtrip-corpus"]' devportal-ui/package.json > /dev/null; then
            npm --prefix devportal-ui run roundtrip-corpus
          else
            echo "::notice::devportal-ui has no 'roundtrip-corpus' script yet; skipping."
          fi
      - name: Pure pytest
        # -p no:sefaria_conftest: the root conftest.py would load sefaria/conftest.py, which needs Django and Mongo.
        run: python -m pytest devportal/tests/pure -q -p no:sefaria_conftest
      - name: Golden checks (TypeScript side)
        # Placeholder: skipped while devportal-ui has no 'golden' npm script.
        run: |
          if jq -e '.scripts["golden"]' devportal-ui/package.json > /dev/null; then
            npm --prefix devportal-ui run golden
          else
            echo "::notice::devportal-ui has no 'golden' script yet; skipping."
          fi
      - name: MCP conformance (official SDK client)
        # Placeholder: skipped while the test does not exist. The mcp SDK is a test-only dependency.
        run: |
          set -euo pipefail
          test_file=devportal/tests/mcp_conformance_test.py
          if [ ! -f "$test_file" ]; then
            echo "::notice::${test_file} does not exist yet; skipping."
            exit 0
          fi
          if [ -f devportal/requirements-test.txt ]; then
            python -m pip install -r devportal/requirements-test.txt
          else
            python -m pip install mcp==1.19.0
          fi
          python -m pytest "$test_file" -q -p no:sefaria_conftest
  devportal-django:
    name: "Continuous Testing: devportal"
    # The developer portal's Django tests (devportal/tests), on the portal's standalone settings: SQLite and no
    # MongoDB (devportal/dev/settings_standalone.py). They ran in the sandbox's pytest pod before #3709.
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
        env:
          # As in pytest-job: datrie's C source needs this with the runner's GCC 14.
          CFLAGS: -Wno-error=incompatible-pointer-types
      - name: Portal Django tests
        # -p no:sefaria_conftest: the root conftest.py would load sefaria/conftest.py, which needs Mongo.
        run: >-
          python -m pytest devportal/tests --ignore=devportal/tests/pure
          --ds=devportal.dev.settings_standalone -p no:sefaria_conftest -q -p no:cacheprovider
  check-python-files:
    runs-on: ubuntu-latest
    outputs:
      python_files_changed: ${{ steps.check-python-files.outputs.python_files_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for Python file changes
        id: check-python-files
        uses: dorny/paths-filter@v2
        with:
          filters: |
            python_files_changed:
              - added|modified|deleted:
                - '**/*.py'
                - 'requirements.txt'
                - 'setup.py'
                - 'pyproject.toml'
                - 'pytest.ini'
                - 'build/ci/prepare-pytest-runner.sh'
                - 'build/ci/restore-test-mongo.sh'
                - 'sefaria/tests/fixtures/mongo/**'
                - '.github/workflows/continuous.yaml'

  # Every pytest job runs on a GitHub-hosted runner; none touches a cluster.
  # The three jobs below use mongomock. sefaria/system/database.py builds a
  # MongoClient at import time, so SEFARIA_MOCK_MONGO=1 is set on each of them and
  # LOCAL_TEST_MONGO_PORT points at a closed port so a missed patch cannot silently
  # talk to a real mongod.
  #
  # pytest-job keeps the required check name "Continuous Testing: PyTest".
  # sefaria/tests/fixtures/mongo/_not-mockable.json is empty: tests the mock cannot
  # represent carry needs_corpus instead, so every job's collection (and the parity
  # check) still sees them.
  #
  # Tests that the mocked library genuinely cannot represent (they need the full
  # ~6,600-index corpus, real Elasticsearch, or a Mongo feature mongomock does not
  # implement) carry `needs_corpus` and are excluded from all three jobs here. They
  # run in pytest-corpus-job, against a real MongoDB restored on its own runner.

  pytest-no-mongo-job:
    name: "Continuous Testing: PyTest (no Mongo)"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    # Local wall clock on an M3: ~1.5-2.5 min for the tests, ~40 s for the parity
    # step (four --collect-only passes: three jobs plus master's baseline).
    # Hosted runners are several times slower.
    timeout-minutes: 45
    # Master ran this suite in the sandbox pod against Postgres; powered_by's
    # row-lock and race tests need it (SQLite has no SELECT ... FOR UPDATE and
    # locks whole tables). prepare-pytest-runner.sh points `default` here.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTEST_POSTGRES_HOST: localhost
      SEFARIA_MOCK_MONGO: "1"
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27099"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
        env:
          # datrie has no wheel for Python 3.12 and its C source no longer compiles with the
          # runner's GCC 14, which made incompatible pointer types an error. Keep it a warning.
          CFLAGS: -Wno-error=incompatible-pointer-types
      - name: Run no-Mongo pytest tests
        # The complement of the other two jobs: everything master's single
        # `-m "not deep and not failing"` run selected that is not needs_mongo,
        # needs_linker or needs_corpus. It resolves refs through the library
        # built from sefaria/tests/fixtures/mongo/_base.json. This used to be a
        # hand-kept file allowlist, which left ~1,200 tests running nowhere.
        #
        # ./semantic_search is outside master's baseline paths but ran in this
        # job's old allowlist; it stays so this change drops no coverage. The two
        # scripts/ directories are passed whole: pytest.ini's python_files lists
        # their test_*.py patterns, so every tooling test runs here.
        run: >
          python -m pytest -q --reuse-db
          -m "not deep and not failing and not needs_mongo and not needs_linker and not needs_corpus"
          ./sefaria ./sso ./reader ./powered_by
          ./semantic_search
          scripts/test_impact scripts/pytest_minimal_dataset
      - name: Check the Mongo fixtures against the collected tests
        run: python scripts/pytest_minimal_dataset/check_fixtures.py
      - name: Check CI parity with master's pytest selection
        # Fails if any test master's baseline selects is collected by none of the
        # pytest jobs in this workflow, pytest-corpus-job included.
        # On pull_request the baseline is the base branch, not this checkout's
        # master: a test removed upstream is informational, a hidden one fails.
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            ARGS+=(--baseline-ref FETCH_HEAD)
          fi
          python scripts/test_impact/ci_parity.py "${ARGS[@]}"
      - name: Fixtures were not rewritten by the tests
        run: git diff --exit-code -- sefaria/tests/fixtures/mongo
  pytest-job:
    name: "Continuous Testing: PyTest"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    # ~7.5 min locally: every needs_mongo test reseeds the ~17 MB shared base
    # and rebuilds the library (~5 s each). Hosted runners are slower.
    timeout-minutes: 45
    # Master ran this suite in the sandbox pod against Postgres; powered_by's
    # row-lock and race tests need it (SQLite has no SELECT ... FOR UPDATE and
    # locks whole tables). prepare-pytest-runner.sh points `default` here.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTEST_POSTGRES_HOST: localhost
      SEFARIA_MOCK_MONGO: "1"
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27099"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
        env:
          # datrie has no wheel for Python 3.12 and its C source no longer compiles with the
          # runner's GCC 14, which made incompatible pointer types an error. Keep it a warning.
          CFLAGS: -Wno-error=incompatible-pointer-types
      - name: Run mocked Mongo pytest tests
        run: >
          python -m pytest -q --reuse-db
          -m "not deep and not failing and needs_mongo and not needs_linker and not needs_corpus"
          ./sefaria ./sso ./reader ./powered_by
      - name: Fixtures were not rewritten by the tests
        run: git diff --exit-code -- sefaria/tests/fixtures/mongo
  pytest-linker-job:
    name: "Continuous Testing: PyTest (linker)"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Master ran this suite in the sandbox pod against Postgres; powered_by's
    # row-lock and race tests need it (SQLite has no SELECT ... FOR UPDATE and
    # locks whole tables). prepare-pytest-runner.sh points `default` here.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTEST_POSTGRES_HOST: localhost
      SEFARIA_MOCK_MONGO: "1"
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27099"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
        env:
          # datrie has no wheel for Python 3.12 and its C source no longer compiles with the
          # runner's GCC 14, which made incompatible pointer types an error. Keep it a warning.
          CFLAGS: -Wno-error=incompatible-pointer-types
      - name: Run linker pytest tests
        run: >
          python -m pytest -q --reuse-db
          -m "not deep and not failing and needs_linker and not needs_corpus"
          ./sefaria ./sso ./reader ./powered_by
      - name: Fixtures were not rewritten by the tests
        run: git diff --exit-code -- sefaria/tests/fixtures/mongo
  # Tests marked needs_corpus: the mocked library cannot represent them (real
  # texts/links, the full ~6,600-index library, Mongo features mongomock lacks).
  # They run against a real MongoDB on this runner, restored from Sefaria's public
  # dump_small (see build/ci/restore-test-mongo.sh). No cluster, no cloud credentials.
  pytest-corpus-job:
    name: "Continuous Testing: PyTest (corpus)"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Master ran this suite in the sandbox pod against Postgres; powered_by's
    # row-lock and race tests need it (SQLite has no SELECT ... FOR UPDATE and
    # locks whole tables). prepare-pytest-runner.sh points `default` here.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTEST_POSTGRES_HOST: localhost
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27017"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
        env:
          # datrie has no wheel for Python 3.12 and its C source no longer compiles with the
          # runner's GCC 14, which made incompatible pointer types an error. Keep it a warning.
          CFLAGS: -Wno-error=incompatible-pointer-types
      - name: Restore the public test dump into a local MongoDB
        run: bash build/ci/restore-test-mongo.sh
      - name: Run corpus pytest tests
        run: >
          python -m pytest -q --reuse-db
          -m "needs_corpus and not deep and not failing"
          ./sefaria ./sso ./reader ./powered_by
  sandbox-deploy:
    name: "Continuous Testing: Sandbox Deploy"
    concurrency:
      group: dev-mongo
      cancel-in-progress: false
    needs: [ build-derived ]
    # Pytest runs on GitHub runners now (#3709); the sandbox exists only for the e2e gate (e2e-job),
    # so every non-draft PR gets one and pushes to master none.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.DEV_PROJECT }}
          install_components: 'gke-gcloud-auth-plugin'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set up yq
        uses: frenck/action-setup-yq@v1
      - name: Authenticate GHA Runner To Target Cluster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{secrets.DEV_GKE_CLUSTER}}
          location: ${{secrets.DEV_GKE_REGION}}
          project_id: ${{secrets.DEV_GCP_PROJECT}}
      - name: Deploy Sandbox
        run: ./build/ci/sandbox-helm-deploy.sh build/ci/sandbox-values.yaml
        env:
          GIT_COMMIT: "${{ steps.get-sha.outputs.sha_short }}"
          BRANCH: "${{ steps.branch-name.outputs.current_branch }}"
          PROJECT_ID: "${{ secrets.DEV_PROJECT }}"
          NAMESPACE: "${{secrets.DEV_SANDBOX_NAMESPACE}}"
  sandbox-ready:
    # The sandbox exists only for the e2e gate (e2e-job): non-draft PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: [ sandbox-deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Wait for test sandbox to become available
        # https://gist.github.com/rgl/f90ff293d56dbb0a1e0f7e7e89a81f42
        run: ./build/ci/waitForSandbox.bash
        env:
          WAIT_DURATION: "3000"
          GIT_COMMIT: "${{ steps.get-sha.outputs.sha_short }}"
  e2e-job:
    name: "Continuous Testing: Playwright e2e"   # BDD stories + chrome @pr core journeys
    # Not in the dev-mongo concurrency group: it only drives a browser against the sandbox.
    needs: [ sandbox-ready ]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set outputs
        id: get-sha
        # Same derivation as sandbox-deploy, so this points at the sandbox it deployed.
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Point Playwright at this PR's sandbox
        run: |
          host="sandbox-${{ steps.get-sha.outputs.sha_short }}.cauldron.sefaria.org"
          echo "SANDBOX_URL=https://$host" >> $GITHUB_ENV
          echo "E2E_LIBRARY_URL=https://$host" >> $GITHUB_ENV
          echo "E2E_VOICES_URL=https://sheets.$host" >> $GITHUB_ENV
          echo "E2E_DEVELOPERS_URL=https://developers.$host" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: BDD story tests (blocking)
        id: bdd
        run: npm run test:bdd
        env:
          PLAYWRIGHT_USER_EMAIL: "${{ secrets.PLAYWRIGHT_USER_EMAIL }}"
          PLAYWRIGHT_USER_PASSWORD: "${{ secrets.PLAYWRIGHT_USER_PASSWORD }}"
          PLAYWRIGHT_SUPERUSER_EMAIL: "${{ secrets.PLAYWRIGHT_SUPERUSER_EMAIL }}"
          PLAYWRIGHT_SUPERUSER_PASSWORD: "${{ secrets.PLAYWRIGHT_SUPERUSER_PASSWORD }}"
      - name: Chrome @pr core journeys
        id: pr_suite
        if: ${{ !cancelled() }}
        # The @pr subset of @sanity: read-only core journeys that work on a cauldron sandbox
        # (see e2e-tests/Sanity/README.md). Starts non-blocking: failures are a warning only until
        # the repo variable E2E_PR_BLOCKING is set to 'true'.
        continue-on-error: ${{ vars.E2E_PR_BLOCKING != 'true' }}
        run: npm run test:pr -- --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-pr
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_USER_EMAIL: "${{ secrets.PLAYWRIGHT_USER_EMAIL }}"
          PLAYWRIGHT_USER_PASSWORD: "${{ secrets.PLAYWRIGHT_USER_PASSWORD }}"
          PLAYWRIGHT_SUPERUSER_EMAIL: "${{ secrets.PLAYWRIGHT_SUPERUSER_EMAIL }}"
          PLAYWRIGHT_SUPERUSER_PASSWORD: "${{ secrets.PLAYWRIGHT_SUPERUSER_PASSWORD }}"
      - name: Note non-blocking @pr failure
        if: ${{ !cancelled() && steps.pr_suite.outcome == 'failure' && vars.E2E_PR_BLOCKING != 'true' }}
        run: echo "::warning::Chrome @pr core journeys failed (not blocking because E2E_PR_BLOCKING is not 'true'). See the playwright-reports artifact."
      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-${{ steps.get-sha.outputs.sha_short }}
          path: |
            playwright-report-bdd/
            playwright-report-pr/
          retention-days: 14
          if-no-files-found: ignore
  ending-notification:
    name: "Continuous Testing: Notifications"
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event.pull_request.draft == false) }}
    needs:
      - pytest-no-mongo-job
      - pytest-job
      - pytest-linker-job
      - pytest-corpus-job
      - e2e-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm ci
        working-directory: ./build/notify
      - run: node notifyEnd.js
        working-directory: ./build/notify
        env:
          SLACK_TEST_SUCCESS_WEBHOOK_URL: ${{secrets.SLACK_TEST_SUCCESS_WEBHOOK_URL}}
          SLACK_TEST_FAILURE_WEBHOOK_URL: ${{secrets.SLACK_TEST_FAILURE_WEBHOOK_URL}}
          GITUSER_SLACK_MAP: ${{secrets.GITUSER_SLACK_MAP}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sandbox-cleanup:
    name: "Continuous Testing: Clean up"
    if: ${{ always() && (github.event.pull_request.draft == false) }}
    needs:
      - e2e-job
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.DEV_PROJECT }}
          install_components: 'gke-gcloud-auth-plugin'
      - name: Authenticate GHA Runner To Target Cluster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{secrets.DEV_GKE_CLUSTER}}
          location: ${{secrets.DEV_GKE_REGION}}
          project_id: ${{secrets.DEV_GCP_PROJECT}}
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: check helm
        id: get-helm
        run: echo "count=$(helm list -n $NAMESPACE | grep $NAME | wc -l)" >> $GITHUB_OUTPUT
        env:
          NAMESPACE: ${{ secrets.DEV_SANDBOX_NAMESPACE }}
          NAME: sandbox-${{ steps.get-sha.outputs.sha_short }}
      - name: Uninstall
        run: helm delete sandbox-${{ steps.get-sha.outputs.sha_short }} -n ${{ secrets.DEV_SANDBOX_NAMESPACE }} --debug --timeout 10m0s
        if: steps.get-helm.outputs.count > 0
  continuous-branch-protection:
    needs:
      - build-generic
      - build-derived
      - check-python-files
      - pytest-no-mongo-job
      - pytest-job
      - pytest-linker-job
      - pytest-corpus-job
      - jest-tests
      - auth-service-tests
      - devportal-ui
      - devportal-pure
      - devportal-django
      - sandbox-deploy
      - sandbox-ready
      - e2e-job
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name:
        run: |
          if [ "${{ github.event_name }}" == "merge_group" ]; then
            exit 0
          fi
          if [ "${{ needs.build-generic.result }}" != "success" ] || \
             [ "${{ needs.build-derived.result }}" != "success" ]; then
            echo "One or more build jobs failed"
            exit 1
          fi
          if [ "${{ github.event.pull_request.draft }}" == "false" ]; then
            # jest-tests does not run on drafts; auth-service-tests always runs (it passes vacuously off-path).
            if [ "${{ needs.jest-tests.result }}" != "success" ] || \
               [ "${{ needs.auth-service-tests.result }}" != "success" ]; then
              echo "Jest or auth-service tests failed"
              exit 1
            fi
            if [ "${{ needs.devportal-ui.result }}" != "success" ] || \
               [ "${{ needs.devportal-pure.result }}" != "success" ] || \
               [ "${{ needs.devportal-django.result }}" != "success" ]; then
              echo "Developer portal tests failed"
              exit 1
            fi
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              if [ "${{ needs.sandbox-deploy.result }}" != "success" ] || \
                 [ "${{ needs.sandbox-ready.result }}" != "success" ] || \
                 [ "${{ needs.e2e-job.result }}" != "success" ]; then
                echo "Sandbox or Playwright e2e job failed"
                exit 1
              fi
            fi
            if [ "${{ needs.check-python-files.outputs.python_files_changed }}" == "true" ]; then
              if [ "${{ needs.pytest-no-mongo-job.result }}" != "success" ] || \
                 [ "${{ needs.pytest-job.result }}" != "success" ] || \
                 [ "${{ needs.pytest-linker-job.result }}" != "success" ] || \
                 [ "${{ needs.pytest-corpus-job.result }}" != "success" ]; then
                echo "One or more Python-related test jobs failed"
                exit 1
              fi
            fi
          fi
