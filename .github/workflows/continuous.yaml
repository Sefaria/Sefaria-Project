name: Continuous
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches-ignore:
      - preprod
      - prod
    paths-ignore:
      - "docs/**"
  merge_group:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-generic:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: "Continuous Image Build"
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ web, node ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-${{ matrix.app }}-${{ steps.branch-name.outputs.current_branch }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,enable=true,priority=100,prefix=sha-,suffix=-${{ steps.date.outputs.date }},format=short
            type=sha
          flavor: |
            latest=true
      - name: build and push
        uses: docker/build-push-action@v6
        with:
#         cache-from: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache
#         cache-to: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache, mode=max
          context: .
          push: true
          build-args: |
            TYPE=build
          file: ./build/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-derived:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: "Continuous Image Build Stage 2"
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs:
      - build-generic
    strategy:
      matrix:
        app: [ asset ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-${{ matrix.app }}-${{ steps.branch-name.outputs.current_branch }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,enable=true,priority=100,prefix=sha-,suffix=-${{ steps.date.outputs.date }},format=short
            type=sha
          flavor: |
            latest=true
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: build and push
        uses: docker/build-push-action@v6
        with:
#         cache-from: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache
#         cache-to: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache,mode=max
          context: .
          push: true
          build-args: |
            SRC_IMG=us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-web-${{ steps.branch-name.outputs.current_branch }}:sha-${{ steps.get-sha.outputs.sha_short }}
          file: ./build/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
#######
# Below Tests only run if PR is NOT draft
#######
  jest-tests:
    name: "Continuous Testing: Jest"   # This name is referenced when slacking status
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          npm install
          npm run build-prod
      - run: ls
      - run: pwd
      - name: Run Jest Tests
        run: npm run jest-gha
      - name: Handle Jest Test Results
        run: cat /home/runner/jestResults.json; STATUS=`jq ".numFailedTestSuites" /home/runner/jestResults.json`; exit $STATUS
        if: ${{ always() }}
  check-python-files:
    runs-on: ubuntu-latest
    outputs:
      python_files_changed: ${{ steps.check-python-files.outputs.python_files_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for Python file changes
        id: check-python-files
        uses: dorny/paths-filter@v2
        with:
          filters: |
            python_files_changed:
              - added|modified|deleted:
                - '**/*.py'
                - 'requirements.txt'
                - 'setup.py'
                - 'pyproject.toml'
                - 'pytest.ini'
                - 'build/ci/prepare-pytest-runner.sh'
                - 'build/ci/restore-test-mongo.sh'
                - 'sefaria/tests/fixtures/mongo/**'
                - '.github/workflows/continuous.yaml'

  # Every pytest job runs on a GitHub-hosted runner; none touches a cluster.
  # The three jobs below use mongomock. sefaria/system/database.py builds a
  # MongoClient at import time, so SEFARIA_MOCK_MONGO=1 is set on each of them and
  # LOCAL_TEST_MONGO_PORT points at a closed port so a missed patch cannot silently
  # talk to a real mongod.
  #
  # pytest-job keeps the required check name "Continuous Testing: PyTest".
  # Tests the mock cannot represent carry needs_corpus, so every job's collection
  # (and the parity check) still sees them.
  #
  # Tests that the mocked library genuinely cannot represent (they need the full
  # ~6,600-index corpus, real Elasticsearch, or a Mongo feature mongomock does not
  # implement) carry `needs_corpus` and are excluded from all three jobs here. They
  # run in pytest-corpus-job, against a real MongoDB restored on its own runner.

  pytest-no-mongo-job:
    name: "Continuous Testing: PyTest (no Mongo)"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    # Local wall clock on an M3: ~1.5-2.5 min for the tests, ~40 s for the parity
    # step (four --collect-only passes: three jobs plus master's baseline).
    # Hosted runners are several times slower.
    timeout-minutes: 45
    env:
      SEFARIA_MOCK_MONGO: "1"
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27099"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run no-Mongo pytest tests
        # The complement of the other two jobs: everything master's single
        # `-m "not deep and not failing"` run selected that is not needs_mongo,
        # needs_linker or needs_corpus. It resolves refs through the library
        # built from sefaria/tests/fixtures/mongo/_base.json. This used to be a
        # hand-kept file allowlist, which left ~1,200 tests running nowhere.
        #
        # ./semantic_search is outside master's baseline paths but ran in this
        # job's old allowlist; it stays so this change drops no coverage. The two
        # scripts/ directories are passed whole: pytest.ini's python_files lists
        # their test_*.py patterns, so every tooling test runs here.
        run: >
          python -m pytest -q --reuse-db
          -m "not deep and not failing and not needs_mongo and not needs_linker and not needs_corpus"
          ./sefaria ./sso ./reader ./powered_by
          ./semantic_search
          scripts/test_impact scripts/pytest_minimal_dataset
      - name: Check the Mongo fixtures against the collected tests
        run: python scripts/pytest_minimal_dataset/check_fixtures.py
      - name: Check CI parity with master's pytest selection
        # Fails if any test master's baseline selects is collected by none of the
        # pytest jobs in this workflow, pytest-corpus-job included.
        # On pull_request the baseline is the base branch, not this checkout's
        # master: a test removed upstream is informational, a hidden one fails.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            ARGS+=(--baseline-ref FETCH_HEAD)
          fi
          python scripts/test_impact/ci_parity.py "${ARGS[@]}"
      - name: Fixtures were not rewritten by the tests
        # git status, not git diff: a test that writes a new fixture file leaves it untracked,
        # which git diff --exit-code does not see.
        run: |
          changes=$(git status --porcelain -- sefaria/tests/fixtures/mongo)
          if [ "$changes" ]; then
            echo "The tests changed the committed Mongo fixtures:"
            echo "$changes"
            exit 1
          fi
  pytest-job:
    name: "Continuous Testing: PyTest"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    # ~7.5 min locally: every needs_mongo test reseeds the ~17 MB shared base
    # and rebuilds the library (~5 s each). Hosted runners are slower.
    timeout-minutes: 45
    env:
      SEFARIA_MOCK_MONGO: "1"
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27099"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run mocked Mongo pytest tests
        run: >
          python -m pytest -q --reuse-db
          -m "not deep and not failing and needs_mongo and not needs_linker and not needs_corpus"
          ./sefaria ./sso ./reader ./powered_by
      - name: Fixtures were not rewritten by the tests
        # git status, not git diff: a test that writes a new fixture file leaves it untracked,
        # which git diff --exit-code does not see.
        run: |
          changes=$(git status --porcelain -- sefaria/tests/fixtures/mongo)
          if [ "$changes" ]; then
            echo "The tests changed the committed Mongo fixtures:"
            echo "$changes"
            exit 1
          fi
  pytest-linker-job:
    name: "Continuous Testing: PyTest (linker)"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEFARIA_MOCK_MONGO: "1"
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27099"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run linker pytest tests
        run: >
          python -m pytest -q --reuse-db
          -m "not deep and not failing and needs_linker and not needs_corpus"
          ./sefaria ./sso ./reader ./powered_by
      - name: Fixtures were not rewritten by the tests
        # git status, not git diff: a test that writes a new fixture file leaves it untracked,
        # which git diff --exit-code does not see.
        run: |
          changes=$(git status --porcelain -- sefaria/tests/fixtures/mongo)
          if [ "$changes" ]; then
            echo "The tests changed the committed Mongo fixtures:"
            echo "$changes"
            exit 1
          fi
  # Tests marked needs_corpus: the mocked library cannot represent them (real
  # texts/links, the full ~6,600-index library, Mongo features mongomock lacks).
  # They run against a real MongoDB on this runner, restored from Sefaria's public
  # dump_small (see build/ci/restore-test-mongo.sh). No cluster, no cloud credentials.
  pytest-corpus-job:
    name: "Continuous Testing: PyTest (corpus)"
    needs: [ check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEFARIA_TEST_MONGO: "1"
      LOCAL_TEST_MONGO_PORT: "27017"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Write Django local settings
        run: bash build/ci/prepare-pytest-runner.sh
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore the public test dump into a local MongoDB
        run: bash build/ci/restore-test-mongo.sh
      - name: Run corpus pytest tests
        run: >
          python -m pytest -q --reuse-db
          -m "needs_corpus and not deep and not failing"
          ./sefaria ./sso ./reader ./powered_by
  ending-notification:
    name: "Continuous Testing: Notifications"
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event.pull_request.draft == false) }}
    needs:
      - pytest-no-mongo-job
      - pytest-job
      - pytest-linker-job
      - pytest-corpus-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm ci
        working-directory: ./build/notify
      - run: node notifyEnd.js
        working-directory: ./build/notify
        env:
          SLACK_TEST_SUCCESS_WEBHOOK_URL: ${{secrets.SLACK_TEST_SUCCESS_WEBHOOK_URL}}
          SLACK_TEST_FAILURE_WEBHOOK_URL: ${{secrets.SLACK_TEST_FAILURE_WEBHOOK_URL}}
          GITUSER_SLACK_MAP: ${{secrets.GITUSER_SLACK_MAP}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  continuous-branch-protection:
    needs:
      - build-generic
      - build-derived
      - check-python-files
      - pytest-no-mongo-job
      - pytest-job
      - pytest-linker-job
      - pytest-corpus-job
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name:
        run: |
          if [ "${{ github.event_name }}" == "merge_group" ]; then
            exit 0
          fi
          if [ "${{ needs.build-generic.result }}" != "success" ] || \
             [ "${{ needs.build-derived.result }}" != "success" ]; then
            echo "One or more build jobs failed"
            exit 1
          fi
          if [ "${{ github.event.pull_request.draft }}" == "false" ]; then
            if [ "${{ needs.check-python-files.outputs.python_files_changed }}" == "true" ]; then
              if [ "${{ needs.pytest-no-mongo-job.result }}" != "success" ] || \
                 [ "${{ needs.pytest-job.result }}" != "success" ] || \
                 [ "${{ needs.pytest-linker-job.result }}" != "success" ] || \
                 [ "${{ needs.pytest-corpus-job.result }}" != "success" ]; then
                echo "One or more Python-related test jobs failed"
                exit 1
              fi
            fi
          fi
