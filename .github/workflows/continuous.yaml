name: Continuous
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches-ignore:
      - preprod
      - prod
    paths-ignore:
      - "docs/**"
  merge_group:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-generic:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: "Continuous Image Build"
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ web, node, auth-service ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-${{ matrix.app }}-${{ steps.branch-name.outputs.current_branch }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,enable=true,priority=100,prefix=sha-,suffix=-${{ steps.date.outputs.date }},format=short
            type=sha
          flavor: |
            latest=true
      - name: build and push
        uses: docker/build-push-action@v6
        with:
#         cache-from: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache
#         cache-to: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache, mode=max
          context: .
          push: true
          build-args: |
            TYPE=build
          file: ./build/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-derived:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: "Continuous Image Build Stage 2"
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs:
      - build-generic
    strategy:
      matrix:
        app: [ asset ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-${{ matrix.app }}-${{ steps.branch-name.outputs.current_branch }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,enable=true,priority=100,prefix=sha-,suffix=-${{ steps.date.outputs.date }},format=short
            type=sha
          flavor: |
            latest=true
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: build and push
        uses: docker/build-push-action@v6
        with:
#         cache-from: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache
#         cache-to: type=registry,ref=gcr.io/${{ secrets.DEV_PROJECT }}/sefaria-${{ matrix.app }}/cache,mode=max
          context: .
          push: true
          build-args: |
            SRC_IMG=us-east1-docker.pkg.dev/${{ secrets.DEV_PROJECT }}/containers/sefaria-web-${{ steps.branch-name.outputs.current_branch }}:sha-${{ steps.get-sha.outputs.sha_short }}
          file: ./build/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
#######
# Below Tests only run if PR is NOT draft
#######
  jest-tests:
    name: "Continuous Testing: Jest"   # This name is referenced when slacking status
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          npm install
          npm run build-prod
      - run: ls
      - run: pwd
      - name: Run Jest Tests
        run: npm run jest-gha
      - name: Handle Jest Test Results
        run: cat /home/runner/jestResults.json; STATUS=`jq ".numFailedTestSuites" /home/runner/jestResults.json`; exit $STATUS
        if: ${{ always() }}
  auth-service-tests:
    name: "Continuous Testing: auth-service Go"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for auth-service changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth_service:
              - 'auth-service/**'
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.auth_service == 'true'
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - name: go vet and race tests (Postgres tests included)
        if: steps.changes.outputs.auth_service == 'true'
        working-directory: auth-service
        env:
          PG_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go vet ./...
          go test -race -count=1 ./...
  check-python-files:
    runs-on: ubuntu-latest
    outputs:
      python_files_changed: ${{ steps.check-python-files.outputs.python_files_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for Python file changes
        id: check-python-files
        uses: dorny/paths-filter@v2
        with:
          filters: |
            python_files_changed:
              - added|modified:
                - '**/*.py'
                - 'requirements.txt'
                - 'setup.py'
                - 'pyproject.toml'
  sandbox-deploy:
    name: "Continuous Testing: Sandbox Deploy"
    concurrency:
      group: dev-mongo
      cancel-in-progress: false
    needs: [ build-derived, check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.DEV_PROJECT }}
          install_components: 'gke-gcloud-auth-plugin'
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set up yq
        uses: frenck/action-setup-yq@v1
      - name: Authenticate GHA Runner To Target Cluster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{secrets.DEV_GKE_CLUSTER}}
          location: ${{secrets.DEV_GKE_REGION}}
          project_id: ${{secrets.DEV_GCP_PROJECT}}
      - name: Deploy Sandbox
        run: ./build/ci/sandbox-helm-deploy.sh build/ci/sandbox-values.yaml
        env:
          GIT_COMMIT: "${{ steps.get-sha.outputs.sha_short }}"
          BRANCH: "${{ steps.branch-name.outputs.current_branch }}"
          PROJECT_ID: "${{ secrets.DEV_PROJECT }}"
          NAMESPACE: "${{secrets.DEV_SANDBOX_NAMESPACE}}"
  sandbox-ready:
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    needs: sandbox-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Wait for test sandbox to become available
        # https://gist.github.com/rgl/f90ff293d56dbb0a1e0f7e7e89a81f42
        run: ./build/ci/waitForSandbox.bash
        env:
          WAIT_DURATION: "3000"
          GIT_COMMIT: "${{ steps.get-sha.outputs.sha_short }}"
  pytest-job:
    name: "Continuous Testing: PyTest"
    concurrency:
      group: dev-mongo
      cancel-in-progress: false
    needs: [ sandbox-ready, check-python-files ]
    if: >
      github.event.pull_request.draft == false &&
      needs.check-python-files.outputs.python_files_changed == 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.DEV_PROJECT }}
          install_components: 'gke-gcloud-auth-plugin'
      - name: Authenticate GHA Runner To Target Cluster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{secrets.DEV_GKE_CLUSTER}}
          location: ${{secrets.DEV_GKE_REGION}}
          project_id: ${{secrets.DEV_GCP_PROJECT}}
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Get branch name
        id: branch-raw
        uses: tj-actions/branch-names@v5.1
      - name: Format branch name
        id: branch-name
        run: >-
          echo "current_branch="$(echo ${{ steps.branch-raw.outputs.current_branch }}
          | awk '{print tolower($0)}'
          | sed 's|.*/\([^/]*\)/.*|\1|; t; s|.*|\0|'
          | sed 's/[^a-z0-9\.\-]//g')
          >> $GITHUB_OUTPUT
      - name: Start Job
        run: ./build/ci/createJobFromRollout.sh $GITHUB_RUN_ID $DEPLOY_ENV
        env:
          # dependent on GITHUB_RUN_ID, which is implicitly passed in
          DEPLOY_ENV: sandbox-${{ steps.get-sha.outputs.sha_short }}
      - name: Wait For Job To Finish
        run: ./build/ci/waitForCIJob.bash
        timeout-minutes: 45
        env:
          # dependent on GITHUB_RUN_ID, which is implicitly passed in
          TEST_NAME: pytest
      - name: Get Logs From Cluster and propogate test result
        if: always()
        run: kubectl logs --tail=-1 -l ci-run=$GITHUB_RUN_ID,test-name=pytest 2>/dev/null || echo "(no pod logs available)"
      - name: Cleanup pyTest Pod
        run: kubectl delete jobs -l ci-run=$GITHUB_RUN_ID,test-name=pytest
        if: always()
  e2e-job:
    name: "Continuous Testing: Playwright e2e"   # BDD stories + chrome @pr core journeys
    # No sandbox and no cluster: the whole site runs on this runner (build/ci/start-e2e-app.sh)
    # against a fresh MongoDB restored from the public dump, the way the pytest jobs get theirs
    # (build/ci/restore-test-mongo.sh). Each run has its own data, so PRs never queue on dev-mongo.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORK: /mnt/e2e-app
      # The test accounts are created in this run's throwaway database, so no secrets are needed.
      PLAYWRIGHT_USER_EMAIL: e2e-user@example.com
      PLAYWRIGHT_SUPERUSER_EMAIL: e2e-admin@example.com
      SANDBOX_URL: https://www.sefaria.test   # Voices is derived: voices.sefaria.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test account passwords
        run: |
          for v in PLAYWRIGHT_USER_PASSWORD PLAYWRIGHT_SUPERUSER_PASSWORD; do
            p=$(openssl rand -hex 16); echo "::add-mask::$p"; echo "$v=$p" >> "$GITHUB_ENV"
          done
      # The restore is the slowest step (about 7 minutes), so it runs in the background while
      # dependencies install and the bundles build. Background processes outlive their step.
      - name: Restore the public test dump into a local MongoDB (background)
        run: |
          mkdir -p "$RUNNER_TEMP/mongo"
          (bash build/ci/restore-test-mongo.sh > "$RUNNER_TEMP/mongo/restore.log" 2>&1; echo $? > "$RUNNER_TEMP/mongo/exit") &
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
        env:
          # datrie has no wheel for this Python and its C source no longer compiles with the
          # runner's GCC 14, which made incompatible pointer types an error. Keep it a warning.
          CFLAGS: -Wno-error=incompatible-pointer-types
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundles
        run: npm run build-prod --silent
      - name: Wait for the MongoDB restore
        run: |
          timeout 1200 bash -c 'until [ -f "$RUNNER_TEMP/mongo/exit" ]; do sleep 5; done'
          cat "$RUNNER_TEMP/mongo/restore.log"
          exit "$(cat "$RUNNER_TEMP/mongo/exit")"
      - name: Start Sefaria on this runner
        id: start
        run: bash build/ci/start-e2e-app.sh
        env:
          SKIP_WEBPACK: '1'   # built above, while Mongo was restoring
      - name: BDD story tests (blocking)
        id: bdd
        run: npm run test:bdd
      - name: Chrome @pr core journeys
        id: pr_suite
        # After the BDD step even if it failed, but only when the site is up.
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        # The @pr subset of @sanity: core journeys that work on the runner's site (see
        # e2e-tests/Sanity/README.md §6a). Starts non-blocking: failures are a warning only until
        # the repo variable E2E_PR_BLOCKING is set to 'true'.
        continue-on-error: ${{ vars.E2E_PR_BLOCKING != 'true' }}
        run: npm run test:pr -- --reporter=github,html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-pr
          PLAYWRIGHT_HTML_OPEN: never
      - name: Note non-blocking @pr failure
        if: ${{ !cancelled() && steps.pr_suite.outcome == 'failure' && vars.E2E_PR_BLOCKING != 'true' }}
        run: echo "::warning::Chrome @pr core journeys failed (not blocking because E2E_PR_BLOCKING is not 'true'). See the playwright-reports artifact."
      - name: Upload Playwright reports and server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-${{ github.run_id }}
          path: |
            playwright-report-bdd/
            playwright-report-pr/
            ${{ env.WORK }}/*.log
            ${{ env.WORK }}/gunicorn.out
          retention-days: 14
          if-no-files-found: ignore
  ending-notification:
    name: "Continuous Testing: Notifications"
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event.pull_request.draft == false) }}
    needs:
      - pytest-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm ci
        working-directory: ./build/notify
      - run: node notifyEnd.js
        working-directory: ./build/notify
        env:
          SLACK_TEST_SUCCESS_WEBHOOK_URL: ${{secrets.SLACK_TEST_SUCCESS_WEBHOOK_URL}}
          SLACK_TEST_FAILURE_WEBHOOK_URL: ${{secrets.SLACK_TEST_FAILURE_WEBHOOK_URL}}
          GITUSER_SLACK_MAP: ${{secrets.GITUSER_SLACK_MAP}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sandbox-cleanup:
    name: "Continuous Testing: Clean up"
    if: ${{ always() && (github.event.pull_request.draft == false) }}
    needs:
      - pytest-job
      - e2e-job
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/${{ secrets.DEV_GKE_PROJECT_ID}}/locations/global/workloadIdentityPools/github/providers/github'
          service_account: '${{ secrets.DEV_GKE_SA }}'
      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.DEV_PROJECT }}
          install_components: 'gke-gcloud-auth-plugin'
      - name: Authenticate GHA Runner To Target Cluster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{secrets.DEV_GKE_CLUSTER}}
          location: ${{secrets.DEV_GKE_REGION}}
          project_id: ${{secrets.DEV_GCP_PROJECT}}
      - name: Set outputs
        id: get-sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: check helm
        id: get-helm
        run: echo "count=$(helm list -n $NAMESPACE | grep $NAME | wc -l)" >> $GITHUB_OUTPUT
        env:
          NAMESPACE: ${{ secrets.DEV_SANDBOX_NAMESPACE }}
          NAME: sandbox-${{ steps.get-sha.outputs.sha_short }}
      - name: Uninstall
        run: helm delete sandbox-${{ steps.get-sha.outputs.sha_short }} -n ${{ secrets.DEV_SANDBOX_NAMESPACE }} --debug --timeout 10m0s
        if: steps.get-helm.outputs.count > 0
  continuous-branch-protection:
    needs:
      - build-generic
      - build-derived
      - check-python-files
      - sandbox-deploy
      - sandbox-ready
      - pytest-job
      - e2e-job
      - jest-tests
      - auth-service-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name:
        run: |
          if [ "${{ github.event_name }}" == "merge_group" ]; then
            exit 0
          fi
          if [ "${{ needs.build-generic.result }}" != "success" ] || \
             [ "${{ needs.build-derived.result }}" != "success" ]; then
            echo "One or more build jobs failed"
            exit 1
          fi
          if [ "${{ github.event.pull_request.draft }}" == "false" ]; then
            # jest-tests is skipped only on drafts; auth-service-tests always runs (it passes vacuously off-path).
            if [ "${{ needs.jest-tests.result }}" != "success" ] || \
               [ "${{ needs.auth-service-tests.result }}" != "success" ]; then
              echo "Jest or auth-service tests failed"
              exit 1
            fi
            if [ "${{ needs.e2e-job.result }}" != "success" ]; then
              echo "Playwright e2e job failed"
              exit 1
            fi
            if [ "${{ needs.check-python-files.outputs.python_files_changed }}" == "true" ]; then
              if [ "${{ needs.sandbox-deploy.result }}" != "success" ] || \
                 [ "${{ needs.sandbox-ready.result }}" != "success" ] || \
                 [ "${{ needs.pytest-job.result }}" != "success" ]; then
                echo "One or more Python-related test jobs failed"
                exit 1
              fi
            fi
          fi
