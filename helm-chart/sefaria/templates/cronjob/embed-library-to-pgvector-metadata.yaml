{{- if .Values.cronJobs.embedLibraryToPgvectorMetadata.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.deployEnv }}-embed-library-to-pgvector-metadata
  labels:
    {{- include "sefaria.labels" . | nindent 4 }}
spec:
  concurrencyPolicy: Forbid
  schedule: {{ .Values.cronJobs.embedLibraryToPgvectorMetadata.schedule | quote }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.cronJobs.embedLibraryToPgvectorMetadata.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.cronJobs.embedLibraryToPgvectorMetadata.ttlSecondsAfterFinished }}
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: embed-library-to-pgvector-metadata
            image: "{{ .Values.web.containerImage.imageRegistry }}:{{ .Values.web.containerImage.tag }}"
            command: ["bash"]
            args: [
              "-c",
              "/app/run /app/sefaria/helper/vector/embed_library_to_pgvector.py --mode=metadata-only --threads={{ .Values.cronJobs.embedLibraryToPgvectorMetadata.threads }}"
            ]
            env:
            - name: REDIS_HOST
              value: "redis-{{ .Values.deployEnv }}"
            - name: TQDM_DISABLE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            envFrom:
            - secretRef:
                name: {{ template "sefaria.secrets.pgvectorPassword" . }}
            - secretRef:
                name: {{ .Values.secrets.localSettings.ref }}
                optional: true
            - configMapRef:
                name: local-settings-{{ .Values.deployEnv }}
            - secretRef:
                name: local-settings-secrets-{{ .Values.deployEnv }}
                optional: true
            volumeMounts:
              - mountPath: /app/sefaria/local_settings.py
                name: local-settings
                subPath: local_settings.py
                readOnly: true
            resources: {{ toYaml .Values.cronJobs.embedLibraryToPgvectorMetadata.resources | nindent 14 }}
          volumes:
          - name: local-settings
            configMap:
              name: local-settings-file-{{ .Values.deployEnv }}
              items:
                - key: local_settings.py
                  path: local_settings.py
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
{{- end }}
