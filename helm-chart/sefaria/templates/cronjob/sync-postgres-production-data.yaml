{{- if and .Values.restore.enabled .Values.cronJobs.syncPostgresProductionData.enabled }}
# Safety check: Only create cronjob if restore is enabled (indicating dedicated DB)
#
# Required GCS Permissions for serviceAccount:
# - storage.objects.list (to list backup files and find the latest)
# - storage.objects.get (to download the backup file)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.deployEnv }}-sync-postgres-production-data
  labels:
    {{- include "sefaria.labels" . | nindent 4 }}
spec:
  schedule: "0 2 * * 0"  # Every week on Sunday at 2 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccount: {{ .Values.backup.postgres.serviceAccount }}
          volumes:
            - name: shared-volume
              emptyDir: {}
          initContainers:
            - name: postgres-backup-downloader
              image: google/cloud-sdk
              volumeMounts:
                - name: shared-volume
                  mountPath: /storage
              command: ["bash"]
              args:
                - -c
                - |
                  set -e
                  echo "Finding latest PostgreSQL backup from production..."
                  
                  # List all postgres backup files and find the latest one by timestamp
                  echo "Listing available backups..."
                  # Use GCS timestamps for reliable sorting (column 2 is the timestamp)
                  latest_backup=$(gsutil ls -l gs://sefaria-user-backup/ | \
                    grep 'postgres_.*\.dump' | \
                    sort -k2 | \
                    tail -1 | \
                    awk '{print $3}')
                  
                  if [ -z "$latest_backup" ]; then
                    echo "ERROR: No PostgreSQL backup files found in bucket"
                    exit 1
                  fi
                  
                  echo "Found latest backup: $latest_backup"
                  echo "Downloading backup..."
                  gsutil cp "$latest_backup" /storage/pg.dump
                  
                  echo "Latest backup downloaded successfully"
          containers:
            - name: sync-postgres-production-data
              image: postgres:{{ .Values.backup.postgres.version }}
              volumeMounts:
                - name: shared-volume
                  mountPath: /storage
              command: ["/bin/bash"]
              args:
                - -c
                - |
                  set -e
                  echo "Starting sync of production PostgreSQL data to {{ .Values.deployEnv }}..."
                  
                  # Use the backup file downloaded by the init container
                  echo "Using backup file downloaded by init container: /storage/pg.dump"

                  # Set PostgreSQL connection environment variables
                  export PGHOST="{{ if .Values.postgres.host }}{{ .Values.postgres.host }}{{ else }}${DATABASES_HOST}{{ end }}"
                  export PGUSER="${DATABASES_USER}"
                  export PGPASSWORD="${DATABASES_PASSWORD}"
                  export PGDATABASE="{{ .Values.postgres.db }}"

                  echo "Restoring to database: $PGDATABASE"
                  echo "Using PostgreSQL host: $PGHOST"

                  # An empty value here would shift the flags of the DROP/CREATE commands
                  # below, so refuse before anything destructive runs.
                  for VAR in PGHOST PGUSER PGDATABASE; do
                    if [[ -z "${!VAR}" ]]; then
                      echo "ERROR: $VAR is empty; refusing to run."
                      exit 1
                    fi
                  done

                  # Never drop the shared database; mirrors the postgres-destroy guard.
                  if [[ "$PGDATABASE" == "sefaria_auth" ]]; then
                    echo "ERROR: refusing to sync into the default 'sefaria_auth' database."
                    echo "Set postgres.db to an environment-specific name to enable this job."
                    exit 1
                  fi

                  # An array, not a string: word-splitting a string would let a stray space
                  # in a value silently become an extra argument.
                  PSQL=(psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d postgres)

                  # Recreate rather than pg_restore --clean, whose DROP SCHEMA public fails
                  # when this env holds objects production lacks. FORCE avoids racing
                  # reconnecting app pods.
                  echo "Dropping and recreating database $PGDATABASE..."
                  "${PSQL[@]}" -c "DROP DATABASE IF EXISTS \"$PGDATABASE\" WITH (FORCE);"
                  "${PSQL[@]}" -c "CREATE DATABASE \"$PGDATABASE\" TEMPLATE template0 ENCODING 'UTF8';"

                  # Prod's backup keeps the API keys (plaintext until KMS lands) for disaster
                  # recovery, so the copy into other environments must not carry them: drop
                  # that table's data entry from the restore list. The table itself is still
                  # created, so the migrations recorded in django_migrations stay true.
                  # STATISTICS DATA entries (pg_dump 18 writes them by default) carry the
                  # column histograms and most-common values, which can hold key strings.
                  # grep exits 1 on "no match" (fine); any other status is a real failure.
                  pg_restore -l /storage/pg.dump > /storage/restore.list
                  grep -v -E ' (TABLE|STATISTICS) DATA public powered_by_apikey( |$)' /storage/restore.list > /storage/restore.filtered.list || [[ $? -eq 1 ]]

                  # --single-transaction: a mid-restore failure rolls back rather than
                  # leaving a half-populated database.
                  echo "Restoring PostgreSQL data..."
                  pg_restore --no-owner --no-privileges --exit-on-error --single-transaction \
                    --use-list=/storage/restore.filtered.list \
                    --dbname="$PGDATABASE" --host="$PGHOST" --username="$PGUSER" /storage/pg.dump

                  # Fail closed: if keys got through, this environment must not keep them. A check
                  # that cannot run counts as a failed check, so set -e must not skip the drop.
                  # Two count queries: count(*) on a missing table errors even inside a CASE, and
                  # the table is absent from dumps taken before Phase 1.
                  fail_closed() {
                    echo "ERROR: $1; dropping the database."
                    "${PSQL[@]}" -c "DROP DATABASE IF EXISTS \"$PGDATABASE\" WITH (FORCE);"
                    exit 1
                  }
                  KEY_ROWS=0
                  HAS_KEYS_TABLE=$(psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -tAc \
                    "SELECT to_regclass('public.powered_by_apikey') IS NOT NULL;") || fail_closed "could not check for the API keys table"
                  if [[ "$HAS_KEYS_TABLE" == "t" ]]; then
                    KEY_ROWS=$(psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -tAc \
                      "SELECT count(*) FROM public.powered_by_apikey;") || fail_closed "could not count the API keys table"
                  fi
                  KEY_STATS=$(psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -tAc \
                    "SELECT count(*) FROM pg_stats WHERE schemaname = 'public' AND tablename = 'powered_by_apikey' AND (most_common_vals IS NOT NULL OR histogram_bounds IS NOT NULL);") || fail_closed "could not check statistics for the API keys table"
                  if [[ "$KEY_ROWS" -ne 0 || "$KEY_STATS" -ne 0 ]]; then
                    fail_closed "$KEY_ROWS API keys and $KEY_STATS statistics rows for them were restored from the production dump"
                  fi

                  # A dump lacking --section=post-data restores cleanly but carries no
                  # indexes or constraints. Fail rather than sit silently unindexed.
                  echo "Verifying indexes and constraints were restored..."
                  IDX_COUNT=$(psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -tAc \
                    "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indrelid
                     JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public';")
                  if [[ "$IDX_COUNT" -eq 0 ]]; then
                    echo "ERROR: restore produced 0 indexes -- the dump is missing its post-data section."
                    exit 1
                  fi
                  echo "Restored $IDX_COUNT indexes."

                  echo "Production PostgreSQL data sync completed successfully"
              envFrom:
                - secretRef:
                    name: {{ .Values.secrets.localSettings.ref }}
                - secretRef:
                    name: local-settings-secrets-{{ .Values.deployEnv }}
                    optional: true
                {{- include "sefaria.secrets.redisSentinel" . | nindent 16 }}
                - configMapRef:
                    name: local-settings-{{ .Values.deployEnv }}
              resources:
                requests:
                  cpu: 500m
                  memory: 500Mi
                limits:
                  cpu: 750m
                  memory: "1Gi"
          restartPolicy: Never
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
{{- end }}
