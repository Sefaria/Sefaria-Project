{{- if eq .Values.nodejs.mode "optin" }}
# nodejs.mode "optin": the new reader client beside the legacy node pods. nginx sends a page request here when the visitor chose
# the new reader (the reader cookie, set from Django's account settings); everyone else stays on the legacy reader.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.deployEnv }}-reader
  labels:
    deployEnv: "{{ .Values.deployEnv }}"
  annotations:
    rollout.argoproj.io/revision: "{{ .Release.Revision }}"
spec:
  strategy:
    blueGreen:
      activeService: reader-{{ .Values.deployEnv }}
      autoPromotionEnabled: true
  selector:
    matchLabels:
      app: reader-{{ .Values.deployEnv }}
  revisionHistoryLimit: 2
  replicas: {{ .Values.reader.replicaCount }}
  template:
    metadata:
      labels:
        app: reader-{{ .Values.deployEnv }}
        tier: application-{{ .Values.deployEnv }}
        deployEnv: "{{ .Values.deployEnv }}"
        stackRole: reader
        releaseRevision: "{{ .Release.Revision }}"
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ .Values.deployEnv | quote }}
        tags.datadoghq.com/service: "reader"
        tags.datadoghq.com/version: {{ .Values.reader.containerImage.tag | quote }}
        {{- end }}
    spec:
      affinity:
        nodeAffinity:
          {{- include "sefaria.nodeAffinities" . | nindent 10 }}
      containers:
      - name: reader
        image: "{{ .Values.reader.containerImage.imageRegistry }}:{{ .Values.reader.containerImage.tag }}"
        imagePullPolicy: Always
        env:
          - name: randomstringtoforceredeployments
            value: {{ randAlphaNum 8 }}
          - name: NODE_OPTIONS
            value: "--max-old-space-size={{ .Values.reader.heapSize }}"
          - name: DEBUG
            value: {{ .Values.localSettings.DEBUG | quote }}
          {{- include "sefaria.readerEnv" (list . .Values.reader.containerImage.tag) | nindent 10 }}
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /healthz-reader
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz-reader
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        resources: {{ toYaml .Values.reader.resources | nindent 10 }}
{{- end }}
