apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.deployEnv }}-node
  labels:
    deployEnv: "{{ .Values.deployEnv }}"
  annotations:
    rollout.argoproj.io/revision: "{{ .Release.Revision }}"
spec:
  strategy:
    blueGreen:
      activeService: node-{{ .Values.deployEnv }}
      autoPromotionEnabled: true
      {{- if .Values.rollouts.prePromotionAnalysis }}
      prePromotionAnalysis:
        templates:
          - templateName: rollout-ready-{{ .Values.deployEnv }}
        args:
          - name: healthcheck-hostname
            value: "nginx-{{ .Values.deployEnv }}-{{ .Release.Revision }}"
      {{- end }}
  selector:
    matchLabels:
      app: node-{{ .Values.deployEnv }}
      # releaseRevision: "{{ .Release.Revision }}" # Variable pod selectors breaks Argo. Check filed issue
  revisionHistoryLimit: 2
  replicas: {{ .Values.nodejs.replicaCount }}
  template:
    metadata:
      labels:
        app: node-{{ .Values.deployEnv }}
        tier: application-{{ .Values.deployEnv }}
        deployEnv: "{{ .Values.deployEnv }}"
        stackRole: nodejs
        releaseRevision: "{{ .Release.Revision }}"
        {{- if .Values.instrumentation.enabled }}
        instrumentation.opentelemetry.io/inject-nodejs: "true"
        {{- end }}
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ .Values.deployEnv | quote }}
        tags.datadoghq.com/service: "node"
        tags.datadoghq.com/version: {{ .Values.nodejs.containerImage.tag | quote }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
      {{- if .Values.datadog.enabled }}
      annotations:
        ad.datadoghq.com/node.logs: '[{"source":"nodejs","service":"{{ .Values.deployEnv }}-node"}]'
        admission.datadoghq.com/js-lib.version: "v5.97.0"
      {{- end }}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - mongo
            topologyKey: kubernetes.io.hostname
        nodeAffinity:
          {{- include "sefaria.nodeAffinities" . | nindent 10 }}
      containers:
      - name: node
        image: "{{ .Values.nodejs.containerImage.imageRegistry }}:{{ .Values.nodejs.containerImage.tag }}"
        imagePullPolicy: Always
        env:
          - name: randomstringtoforceredeployments
            value: {{ randAlphaNum 8 }}
          - name: DJANGO_HOST
            value: web-{{ .Values.deployEnv }}-{{ .Release.Revision }}
          - name: DJANGO_PORT
            value: "80"
          - name: REDIS_HOST
            value: redis-{{ .Values.deployEnv }}
          - name: DEBUG
            value: {{ .Values.localSettings.DEBUG | quote }}
          - name: NODE_OPTIONS
            value: "--max-old-space-size={{ .Values.nodejs.heapSize }}"
          {{- if .Values.datadog.enabled }}
          - name: DD_LOGS_INJECTION
            value: "true"
          {{- end }}
          {{- if eq .Values.nodejs.mode "reader" }}
          # reader-next/src/lib/config.ts: the API through this release's Varnish, with the public Host Django routes by
          - name: SEFARIA_API_ORIGIN
            value: "http://varnish-{{ .Values.deployEnv }}-{{ .Release.Revision }}:8040"
          - name: SEFARIA_API_HOST
            value: {{ printf "www.%s" (tpl (index .Values.domains.root 0).url .) | quote }}
          - name: PUBLIC_API_ORIGIN
            value: ""
          - name: PUBLIC_SITE_ORIGIN
            value: ""
          - name: SEFARIA_PASS_THROUGH
            value: "1"
          - name: PORT
            value: "3000"
          {{- end }}
          {{- if .Values.mongo.enabled }}
          - name: MONGO_HOST
            value: {{ .Values.deployEnv }}-mongo
          {{- end }}
        envFrom:
          - configMapRef:
              name: local-settings-node-{{ .Values.deployEnv }}
              optional: true
          - secretRef:
              name: local-settings-node-secrets-{{ .Values.deployEnv }}
              optional: true
        ports:
        - containerPort: 3000
        {{- if eq .Values.nodejs.mode "reader" }}
        readinessProbe:
          httpGet:
            path: /healthz-reader
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz-reader
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        {{- end }}
        resources: {{ toYaml .Values.nodejs.resources | nindent 10 }}
