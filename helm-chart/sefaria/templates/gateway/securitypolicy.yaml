{{- if and .Values.authService.enabled .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Values.deployEnv }}-auth
  labels:
    deployEnv: {{ .Values.deployEnv | quote }}
    {{- include "sefaria.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.deployEnv }}
  # Phase 1: ext_authz only. The auth service classifies the request and stamps x-sefaria-*; no JWT
  # verification and no rate limiting are attached to the route yet.
  extAuth:
    failOpen: {{ .Values.authService.extAuth.failOpen }}        # auth service down → anonymous tier
    timeout: {{ .Values.authService.extAuth.timeout }}          # EG default is 10s
    headersToExtAuth: [x-api-key, authorization, origin]
    grpc:
      backendRefs:
        - name: auth-service-{{ .Values.deployEnv }}
          port: 9090
{{- end }}
