{{- if and .Values.authService.enabled .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Values.deployEnv }}-auth
  labels:
    deployEnv: {{ .Values.deployEnv | quote }}
    {{- include "sefaria.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.deployEnv }}
  # ext_authz runs before jwt_authn in Envoy Gateway's filter chain, on every request. The auth service
  # classifies the request and stamps x-sefaria-*; with jwt.mode envoy, jwt_authn (below) overwrites the
  # tier/project on a valid first-party token via claimToHeaders.
  extAuth:
    failOpen: {{ .Values.authService.extAuth.failOpen }}        # auth service down → anonymous tier
    timeout: {{ .Values.authService.extAuth.timeout }}          # EG default is 10s
    headersToExtAuth: [x-api-key, authorization, {{ if .Values.authService.jwt.enabled }}cookie, {{ end }}origin]
    grpc:
      backendRefs:
        - name: auth-service-{{ .Values.deployEnv }}
          port: 9090
  {{- if and .Values.authService.jwt.enabled (eq .Values.authService.jwt.mode "envoy") }}
  jwt:
    {{- if .Values.authService.jwt.failOpen }}
    failOpen: true            # [EG >= 1.9] allow_missing_or_failed: invalid token rides the anonymous tier
    {{- else }}
    optional: true            # allow_missing: missing token OK, invalid token is 401 from Envoy
    {{- end }}
    providers:
      - name: sefaria-firstparty
        issuer: {{ include "sefaria.authService.issuer" . | quote }}
        audiences: [{{ .Values.authService.jwt.audience | quote }}]
        remoteJWKS:
          uri: {{ include "sefaria.authService.jwksURL" . | quote }}   # cluster-internal, never the public hostname
          backendRefs:
            - name: {{ default (printf "mint-%s" .Values.deployEnv) .Values.authService.jwt.jwks.service }}
              port: {{ .Values.authService.jwt.jwks.port }}
          cacheDuration: {{ .Values.authService.jwt.cacheDuration }}   # [EG >= 1.6]; Envoy ignores Cache-Control
        claimToHeaders:
          - { claim: tier, header: x-sefaria-tier }
          - { claim: sub, header: x-sefaria-project }
        extractFrom:
          headers:
            - { name: Authorization, valuePrefix: "Bearer " }
          cookies: [{{ .Values.authService.jwt.cookieName | quote }}]
  {{- end }}
{{- end }}
