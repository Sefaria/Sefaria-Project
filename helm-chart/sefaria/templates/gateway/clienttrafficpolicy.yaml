{{- if .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.deployEnv }}
  labels:
    {{- include "sefaria.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.deployEnv }}
  tls:
    alpnProtocols: {{ .Values.gateway.alpnProtocols | toJson | nindent 6 }}
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  {{- if .Values.authService.enabled }}
  # The auth service's identity headers come only from ext_authz. Strip client-sent copies at the listener, before
  # any filter, so a fail-open pass (auth service down or slow) cannot carry a spoofed tier or project upstream.
  headers:
    earlyRequestHeaders:
      remove: [x-sefaria-tier, x-sefaria-project, x-sefaria-auth-result]
  {{- end }}
{{- end }}
