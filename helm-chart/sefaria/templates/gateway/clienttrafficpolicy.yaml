{{- if .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.deployEnv }}
  labels:
    {{- include "sefaria.labels" . | nindent 4 }}
spec:
  # HTTPS listeners only. Gateways are merged into one Envoy, so every environment's port-80 listeners share one Envoy
  # listener, and Envoy Gateway rejects a ClientTrafficPolicy that targets them ("applied to multiple http (non https)
  # listeners ... on the same port"); a Gateway-wide targetRef is rejected whole. HTTPS listeners are split by SNI, so a
  # policy per listener is accepted. Port 80 gets no policy: set gateway.redirectHttpToHttps so it serves only redirects.
  targetRefs:
    {{- range splitList "," (include "sefaria.gatewayListenerNames" (dict "root" $ "proto" "https")) }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.deployEnv }}
      sectionName: {{ . }}
    {{- end }}
  tls:
    alpnProtocols: {{ .Values.gateway.alpnProtocols | toJson | nindent 6 }}
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  {{- if .Values.authService.enabled }}
  # The auth service's identity headers come only from ext_authz. Strip client-sent copies at the listener, before
  # any filter, so a fail-open pass (auth service down or slow) cannot carry a spoofed tier, project or meter upstream.
  # Effective only together with gateway.redirectHttpToHttps: plain-HTTP requests reach no listener policy.
  headers:
    earlyRequestHeaders:
      remove: [x-sefaria-tier, x-sefaria-project, x-sefaria-auth-result, x-sefaria-meter]
  {{- end }}
{{- end }}
