{{- if and .Values.authService.enabled .Values.gateway.enabled .Values.authService.rateLimit.enabled }}
{{- $rl := .Values.authService.rateLimit }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.deployEnv }}-auth-ratelimit
  labels:
    deployEnv: {{ .Values.deployEnv | quote }}
    {{- include "sefaria.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.deployEnv }}
  rateLimit:
    type: Global                                   # counters in the controller's Redis, shared by all Envoy replicas
    global:
      # Rules are appended in a fixed order: append only. Reordering or inserting changes which counter a request
      # lands in. The limit of rules 1-2 is read per request from the ext_authz dynamic metadata, which the auth
      # service fills from the project's tier tables; `requests` is the static fallback when the auth service is down
      # (fail-open) or sends no metadata, so nothing is ever unlimited.
      rules:
        - clientSelectors:                         # 1. per minute, per project
            - headers:
                - { name: x-sefaria-project, type: Distinct }
          limit:
            requests: {{ $rl.defaults.perMinutePerProject }}
            unit: Minute
            fromMetadata: { namespace: envoy.filters.http.ext_authz, key: limit_minute }{{ if $rl.headers }}
          xRateLimitHeaders: DraftVersion03{{ end }}
        {{- range $meter, $_ := .Values.authService.meters }}
        - clientSelectors:                         # 2. per month, per project, one rule per meter
            - headers:
                - { name: x-sefaria-meter, type: Exact, value: {{ $meter }} }
                - { name: x-sefaria-project, type: Distinct }
          limit:
            requests: {{ int64 $rl.defaults.monthlyPerProject }}
            unit: Month
            fromMetadata: { namespace: envoy.filters.http.ext_authz, key: limit_month_{{ $meter }} }
        {{- end }}
        - clientSelectors:                         # 3. anonymous: best-effort per client IP
            - headers:
                - { name: x-sefaria-tier, type: Exact, value: anonymous }
              sourceCIDR: { type: Distinct, value: 0.0.0.0/0 }
          limit: { requests: {{ $rl.anonymousPerIP }}, unit: Minute }{{ if $rl.headers }}
          xRateLimitHeaders: DraftVersion03{{ end }}
        - clientSelectors:                         # 4. a missing or unknown tier, at the anonymous limits
            - headers:
                - { name: x-sefaria-tier, type: RegularExpression, value: "^(developer|partner|internal|anonymous|embed)$", invert: true }
          limit: { requests: {{ $rl.anonymousShared }}, unit: Minute }{{ if $rl.headers }}
          xRateLimitHeaders: DraftVersion03{{ end }}
  responseOverride:                                # agent-readable 429 (product spec)
    - match:
        statusCodes:
          - { type: Value, value: 429 }
      response:
        contentType: application/json
        statusCode: 429
        header:
          set:
            - { name: Retry-After, value: {{ $rl.retryAfterSeconds | quote }} }
        body:
          type: Inline
          inline: '{"error":"Too many requests for this project in the current window, or its monthly quota for this product is used up.","code":"rate_limited","help":"{{ .Values.authService.helpURL }}rate_limited","project":"%REQ(x-sefaria-project)%","tier":"%REQ(x-sefaria-tier)%","meter":"%REQ(x-sefaria-meter)%"}'
{{- end }}
