{{- if .Values.authService.enabled }}
{{- $name := printf "auth-service-upstream-%s" .Values.deployEnv }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The value the auth service stamps as x-sefaria-auth-secret on requests allowed with an active API key, and the web pods
# compare before trusting its x-sefaria-* headers. Generated once and kept: lookup returns the live value on upgrades, and
# the keep policy leaves it in place when the auth service is turned off, so turning it back on reuses it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: auth-service-{{ .Values.deployEnv }}
    deployEnv: "{{ .Values.deployEnv }}"
    stackRole: auth-service
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "AUTH_SERVICE_UPSTREAM_SECRET") }}
  AUTH_SERVICE_UPSTREAM_SECRET: {{ index $existing.data "AUTH_SERVICE_UPSTREAM_SECRET" }}
  {{- else }}
  AUTH_SERVICE_UPSTREAM_SECRET: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
