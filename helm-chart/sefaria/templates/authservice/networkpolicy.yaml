{{- if and .Values.authService.enabled .Values.authService.networkPolicy.enabled }}
{{- $np := .Values.authService.networkPolicy }}
# The Check response carries the upstream secret for a keyed request on a gated path, so only the Envoy Gateway proxies
# may call gRPC, and only Prometheus may read the HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-{{ .Values.deployEnv }}
  labels:
    app: auth-service-{{ .Values.deployEnv }}
    deployEnv: "{{ .Values.deployEnv }}"
    stackRole: auth-service
spec:
  podSelector:
    matchLabels:
      app: auth-service-{{ .Values.deployEnv }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {{ toYaml $np.gateway.namespaceSelector | nindent 12 }}
          podSelector: {{ toYaml $np.gateway.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - namespaceSelector: {{ toYaml $np.prometheus.namespaceSelector | nindent 12 }}
          podSelector: {{ toYaml $np.prometheus.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
