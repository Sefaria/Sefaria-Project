{{- if eq .Values.backup.postgres.enabled true }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: create-pg-dumps-{{ .Values.deployEnv }}
  labels:
    deployEnv: "{{ .Values.deployEnv }}"
    {{- include "sefaria.labels" . | nindent 4 }}
data:
  create-dumps.sh: |-
    #!/usr/bin/env bash
    set -e

    echo "=== PostgreSQL Backup Script ==="
    echo "Started at: $(date)"
    echo ""

    DATADIR="/pgdumps/shared_volume"
    DUMP_FILE="$DATADIR/pg.dump"
    LOG_FILE="$DATADIR/backup.log"
    COUNTS_FILE="$DATADIR/row_counts.txt"

    # Connection parameters
    PG_HOST="{{ if .Values.postgres.host }}{{ .Values.postgres.host }}{{ else }}${DATABASES_HOST}{{ end }}"
    PG_PORT="${DATABASES_PORT:-5432}"
    PG_USER="${DATABASES_USER}"
    PG_DB="sefaria_auth"

    if [[ -z "$PG_HOST" ]]; then
      echo "ERROR: no Postgres host resolved (set postgres.host or DATABASES_HOST)."
      exit 1
    fi

    echo "=== Connection Info ==="
    echo "Host: $PG_HOST"
    echo "Port: $PG_PORT"
    echo "User: $PG_USER"
    echo "Database: $PG_DB"
    echo ""

    # Set password
    if [[ -n "$DATABASES_PASSWORD" ]]; then
      export PGPASSWORD="${DATABASES_PASSWORD}"
      echo "Password: ***SET***"
    else
      echo "Password: (not set)"
    fi
    echo ""

    # A client older than the server aborts pg_dump outright; a client newer than
    # the server means this job is pointed at an instance the chart no longer
    # tracks. Either way the version pin and the host have drifted apart.
    SERVER_VERSION_NUM=$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -tAc "SHOW server_version_num;" | xargs)
    # Report an unreachable or unauthenticated server as itself. Without this an
    # empty result arithmetically evaluates to 0 and the mismatch below blames the
    # version pin, sending the operator to the wrong knob.
    if ! [[ "$SERVER_VERSION_NUM" =~ ^[0-9]+$ ]]; then
      echo "ERROR: could not read server version from $PG_HOST (got '$SERVER_VERSION_NUM')."
      echo "The server is unreachable, the credentials are wrong, or $PG_DB does not exist."
      exit 1
    fi
    SERVER_MAJOR=$((SERVER_VERSION_NUM / 10000))
    # $3, not $NF: builds append a packaging suffix ("... 18.3 (Debian 18.3-1.pgdg13+1)",
    # "... 14.18 (Homebrew)"), and the last field is not always the version.
    CLIENT_MAJOR=$(pg_dump --version | awk '{print $3}' | cut -d. -f1)
    if [[ "$SERVER_MAJOR" != "$CLIENT_MAJOR" ]]; then
      echo "ERROR: pg_dump client major version $CLIENT_MAJOR does not match server major version $SERVER_MAJOR at $PG_HOST."
      echo "Set backup.postgres.version to match the server, or correct postgres.host."
      exit 1
    fi
    echo "Client/server major version: $CLIENT_MAJOR (match)"
{{- if gt (int .Values.backup.postgres.maxSourceStalenessDays) 0 }}
    # A frozen source is the failure this backup went 12 weeks without noticing:
    # the job dumped a decommissioned instance whose newest row predated the
    # cutover. Row counts alone cannot see it -- a stale database still counts.
    MAX_STALE_DAYS={{ .Values.backup.postgres.maxSourceStalenessDays }}
    SOURCE_AGE_DAYS=$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -tAc \
      "SELECT COALESCE(floor(EXTRACT(EPOCH FROM (now() - max(date_joined))) / 86400)::int, 999999) FROM auth_user;" | xargs)
    # An empty result would compare as 0 and pass, disabling this guard in exactly
    # the case where the source is least trustworthy.
    if ! [[ "$SOURCE_AGE_DAYS" =~ ^[0-9]+$ ]]; then
      echo "ERROR: could not read source freshness from $PG_HOST (got '$SOURCE_AGE_DAYS')."
      exit 1
    fi
    if [[ "$SOURCE_AGE_DAYS" -gt "$MAX_STALE_DAYS" ]]; then
      echo "ERROR: newest auth_user.date_joined is $SOURCE_AGE_DAYS days old (limit $MAX_STALE_DAYS)."
      echo "This source looks frozen -- check that $PG_HOST is the live instance."
      exit 1
    fi
    echo "Source freshness: newest account is $SOURCE_AGE_DAYS day(s) old (limit $MAX_STALE_DAYS)"
{{- end }}

    # Count rows in all tables BEFORE dump
    echo "=== Pre-Dump Row Counts ==="
    echo "table_name,row_count" > "$COUNTS_FILE"
    
    TABLES=$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -c "
      SELECT table_name 
      FROM information_schema.tables 
      WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
      ORDER BY table_name;
    ")

    TOTAL_ROWS=0
    for TABLE in $TABLES; do
      TABLE=$(echo "$TABLE" | xargs)
      if [[ -n "$TABLE" ]]; then
        COUNT=$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -c \
          "SELECT COUNT(*) FROM \"$TABLE\";" | xargs)
        echo "$TABLE: $COUNT rows"
        echo "$TABLE,$COUNT" >> "$COUNTS_FILE"
        TOTAL_ROWS=$((TOTAL_ROWS + COUNT))
      fi
    done
    echo "TOTAL: $TOTAL_ROWS rows"
    echo ""

    # Build and run dump command
    echo "=== Starting pg_dump ==="
    START_TIME=$(date +%s)

    pg_dump \
      --file="$DUMP_FILE" \
      --host="$PG_HOST" \
      --port="$PG_PORT" \
      --username="$PG_USER" \
      --verbose \
      --format=c \
      --no-owner \
      --section=pre-data \
      --section=data \
      --section=post-data \
      --no-privileges \
      --no-tablespaces \
      --no-unlogged-table-data \
      {{- range .Values.backup.postgres.excludeTableData }}
      {{- /* Single-quoted so the shell neither globs nor splits it; pg_dump still
             applies its own pattern matching to the value it receives. */}}
      --exclude-table-data={{ . | squote }} \
      {{- end }}
      "$PG_DB" 2>&1

    DUMP_EXIT_CODE=${PIPESTATUS[0]}
    END_TIME=$(date +%s)
    DURATION=$((END_TIME - START_TIME))

    echo ""
    echo "=== Dump Complete ==="
    echo "Exit code: $DUMP_EXIT_CODE"
    echo "Duration: ${DURATION} seconds"

    if [[ ! -f "$DUMP_FILE" ]]; then
      echo "ERROR: Dump file was not created!"
      exit 1
    fi

    DUMP_SIZE=$(ls -lh "$DUMP_FILE" | awk '{print $5}')
    DUMP_SIZE_BYTES=$(stat -c%s "$DUMP_FILE" 2>/dev/null || stat -f%z "$DUMP_FILE" 2>/dev/null)
    echo "File size: $DUMP_SIZE ($DUMP_SIZE_BYTES bytes)"
    echo ""

    # Verify dump contents - count rows in dump
    echo "=== Verifying Dump Contents ==="

    # Get tables from dump.
    # A `pg_restore --list` TABLE DATA entry is:
    #   3339; 0 16401 TABLE DATA public auth_group sefaria
    #    $1  $2  $3    $4    $5    $6      $7        $8
    # $6 is the schema and $7 the table. This previously read $6, so every entry
    # was the literal "public" -- each comparison below was 0-vs-0 and always passed.
    DUMP_ENTRIES=$(pg_restore --list "$DUMP_FILE" | awk '$4 == "TABLE" && $5 == "DATA" { print $6 "." $7 }')

    if [[ -z "$DUMP_ENTRIES" ]]; then
      echo "ERROR: no TABLE DATA entries found in the dump; cannot verify."
      exit 1
    fi

    echo ""
    printf "%-35s | %12s | %12s | %12s | %s\n" "Table" "DB Rows" "Dump Rows" "Diff" "Status"
    printf "%-35s-|-%12s-|-%12s-|-%12s-|-%s\n" "-----------------------------------" "------------" "------------" "------------" "--------"

    TOTAL_DB=0
    TOTAL_DUMP=0
    MISMATCH=0

    for ENTRY in $DUMP_ENTRIES; do
      if [[ -z "$ENTRY" ]]; then
        continue
      fi

      SCHEMA="${ENTRY%%.*}"
      TABLE="${ENTRY#*.}"

      # Get DB count (live query). stderr is deliberately not suppressed: an empty
      # result fails the run below, so the reason has to reach the log.
      DB_COUNT=$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -c \
        "SELECT COUNT(*) FROM \"$SCHEMA\".\"$TABLE\";" | xargs)

      if [[ -z "$DB_COUNT" ]]; then
        printf "%-35s | %12s | %12s | %12s | %s\n" "$SCHEMA.$TABLE" "ERROR" "-" "-" "DB ERROR"
        MISMATCH=$((MISMATCH + 1))
        continue
      fi

      # Get dump count by extracting and counting rows.
      # -f - is required: since PG 12 pg_restore refuses to write to stdout without
      # it ("one of -d/--dbname and -f/--file must be specified"). The 10.3 client
      # this job used to run defaulted to stdout, so the omission was invisible
      # until the client was unpinned -- and would have counted 0 rows for every
      # table, failing the run at the gate below.
      # The terminator pattern is anchored: an unanchored "^\\." is backslash +
      # ANY character, which also swallows data rows whose first column is NULL.
      DUMP_COUNT=$(pg_restore --data-only --schema="$SCHEMA" --table="$TABLE" -f - "$DUMP_FILE" 2>/dev/null | \
        grep -v "^SET " | grep -v "^SELECT " | grep -v "^--" | grep -v "^$" | \
        grep -v "^COPY " | grep -v '^\\\.$' | wc -l | xargs)

      if [[ -z "$DUMP_COUNT" ]]; then
        DUMP_COUNT=0
      fi

      # Calculate difference and percentage
      DIFF=$((DB_COUNT - DUMP_COUNT))

      # Calculate percentage difference (allow 1% tolerance for changes during backup)
      if [[ $DB_COUNT -gt 0 ]]; then
        DIFF_PCT=$(awk "BEGIN {printf \"%.2f\", ($DIFF / $DB_COUNT) * 100}")
        ABS_DIFF_PCT=$(awk "BEGIN {printf \"%.2f\", sqrt(($DIFF_PCT)^2)}")
      else
        ABS_DIFF_PCT=0
      fi

      # Status logic: OK if exact match or within 1% tolerance
      if [[ $DIFF -eq 0 ]]; then
        STATUS="OK"
      elif (( $(awk "BEGIN {print ($ABS_DIFF_PCT <= 1.0)}") )); then
        STATUS="OK (±1%)"
      elif [[ $DIFF -gt 0 ]]; then
        STATUS="MISSING"
        MISMATCH=$((MISMATCH + 1))
      else
        STATUS="EXTRA"
        MISMATCH=$((MISMATCH + 1))
      fi

      printf "%-35s | %12s | %12s | %12s | %s\n" "$SCHEMA.$TABLE" "$DB_COUNT" "$DUMP_COUNT" "$DIFF" "$STATUS"

      TOTAL_DB=$((TOTAL_DB + DB_COUNT))
      TOTAL_DUMP=$((TOTAL_DUMP + DUMP_COUNT))
    done

    echo ""
    printf "%-35s | %12s | %12s | %12s |\n" "TOTAL" "$TOTAL_DB" "$TOTAL_DUMP" "$((TOTAL_DB - TOTAL_DUMP))"
    echo ""

    # Final summary
    echo "=== Summary ==="
    echo "Tables checked: $(echo "$DUMP_ENTRIES" | wc -w)"
    echo "Tables with mismatches (>1%): $MISMATCH"
    echo ""

    if [[ $MISMATCH -eq 0 ]]; then
      echo "SUCCESS: All row counts match within tolerance! Dump is complete."
      echo "Note: Differences within 1% are allowed to account for changes during backup."
    else
      echo "WARNING: Found $MISMATCH table(s) with row count differences >1%"
      echo "This could indicate data changes during dump or incomplete dump"
    fi

    echo ""
    echo "=== Backup Script Complete ==="
    echo "Finished at: $(date)"
    echo "Dump file: $DUMP_FILE"
    echo "Row counts saved to: $COUNTS_FILE"

    if [[ $MISMATCH -gt 0 ]]; then
      echo "ERROR: verification failed for $MISMATCH table(s); refusing to publish this dump."
      exit 1
    fi

    exit $DUMP_EXIT_CODE
{{- end }}
