{{- if and .Values.keda.enabled .Values.keda.splash.enabled .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.deployEnv }}-keda-splash
  labels:
{{- include "sefaria.labels" . | nindent 4 }}
    deployEnv: {{ .Values.deployEnv | quote }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.deployEnv }}
{{- if .Values.authService.spikeLimit.enabled }}
  # Spike (never merged): the limit comes from the ext_authz dynamic metadata; 1000/Minute applies when absent.
  # Same object as the splash override because two policies on one HTTPRoute conflict.
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-sefaria-project
                  type: Distinct
          limit:
            requests: 1000
            unit: Minute
            fromMetadata:
              namespace: envoy.filters.http.ext_authz
              key: limit_minute
        - clientSelectors:
            - headers:
                - name: x-sefaria-project
                  type: Distinct
          limit:
            requests: 1000
            unit: Month
            fromMetadata:
              namespace: envoy.filters.http.ext_authz
              key: limit_month
{{- end }}
  responseOverride:
    - match:
        statusCodes:
          {{- toYaml .Values.keda.splash.statusCodes | nindent 10 }}
      response:
        contentType: text/html
        body:
          type: Inline
          inline: |
{{ .Values.keda.splash.body | nindent 12 }}
{{- end }}
