apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: rollout-complete-{{ .Values.deployEnv }}
  labels:
    deployEnv: "{{ .Values.deployEnv }}"
spec:
  args:
    - name: revision
    - name: deployment
    - name: version
    - name: chartVersion
  metrics:
    - name: healthcheck-ready
      provider:
        job:
          spec:
            backoffLimit: 1
            # Caps how long this Job's pod can run. This Job is the
            # AnalysisRun's metric provider, and the AnalysisRun stays
            # Running (blocking promotion) until the pod completes. Without
            # this, a hung curl call (see --max-time/--connect-timeout
            # below) would still leave the pod itself with no upper bound.
            #
            # Deliberately generous. Both curls are already capped at 30s
            # each, so the real work finishes in well under a minute; this
            # only has to survive a cold image pull on a fresh node. It is a
            # backstop against a pathological hang, NOT a routine timeout —
            # the distinction matters because exceeding it terminates the Job
            # as Failed, which fails this post-promotion AnalysisRun and
            # aborts the promotion. Aborting a promotion over a Slack
            # notification would be a bad trade, so the deadline is set far
            # above anything a healthy run can reach.
            activeDeadlineSeconds: 600
            template:
              spec:
                containers:
                  - name: completion-message
                    image: curlimages/curl
                    command: [ "sh"]
                    args:
                      - -c
                      - >
                        curl
                        -X
                        POST
                        --max-time
                        30
                        --connect-timeout
                        10
                        --data-urlencode
                        'payload={"username": "Deployment Status", "text": "'$ENV' revision '$REVISION' has deployed version '$VERSION' using chart '$CHART_VERSION'", "icon_emoji": ":globe_with_meridians:"}'
                        $SLACK_URL
                        ||
                        /bin/true
                    env:
                      - name: REVISION
                        value: "{{`{{args.revision}}`}}" # {{`...`}}
                      - name: ENV   
                        value: "{{`{{args.deployment}}`}}" # {{`...`}}
                      - name: VERSION
                        value: "{{`{{args.version}}`}}" # {{`...`}}
                      - name: CHART_VERSION
                        value: "{{`{{args.chartVersion}}`}}"
                      # No channel override: the incoming webhook posts to its own configured channel.
                      - name: SLACK_URL
                        valueFrom:
                          secretKeyRef:
                            name: {{ .Values.secrets.localSettings.ref }}
                            key: SLACK_URL
                            optional: true
                  {{- if eq .Values.deployEnv "prod" }}
                  # Prod-only: relay the confirmed-healthy rollout to Sefaria-Project so a
                  # GitHub Actions workflow can generate and post full release notes. Fires
                  # only after Argo's own post-promotion analysis reaches this point, so it
                  # carries the same health guarantee as the Slack ping above. A missing or
                  # failing token/call must never fail the rollout itself.
                  #
                  # `version` is the load-bearing field in this payload: the receiving
                  # workflow derives the shipped commit range purely from prod/* git tags
                  # using this value (see .github/workflows/prod-release-notes.yaml), rather
                  # than from any PR. The version arg below may arrive with a leading "v"
                  # (e.g. v6.111.0-prod.1) — that workflow strips it; this template does not.
                  #
                  # -sS -f plus --max-time/--connect-timeout: curl exits 0 on
                  # HTTP 401/403 by default, so without -f the `|| /bin/true`
                  # fallback would never fire for the most likely failure — a
                  # missing or bad dispatch token (GH_DISPATCH_TOKEN is
                  # optional, so absent is a live case). Without a timeout, a
                  # hung call to the GitHub API leaves this Job incomplete,
                  # which stalls the AnalysisRun that depends on it — see the
                  # Job-level activeDeadlineSeconds above as the backstop.
                  - name: notify-github
                    image: curlimages/curl
                    command: [ "sh" ]
                    args:
                      - -c
                      - >
                        curl
                        -sS
                        -f
                        --max-time
                        30
                        --connect-timeout
                        10
                        -X
                        POST
                        -H
                        "Authorization: token $GH_DISPATCH_TOKEN"
                        -H
                        "Accept: application/vnd.github+json"
                        https://api.github.com/repos/Sefaria/Sefaria-Project/dispatches
                        -d
                        '{"event_type":"prod-rollout-succeeded","client_payload":{"revision":"'$REVISION'","version":"'$VERSION'","chartVersion":"'$CHART_VERSION'"}}'
                        ||
                        /bin/true
                    env:
                      - name: REVISION
                        value: "{{`{{args.revision}}`}}" # {{`...`}}
                      - name: VERSION
                        value: "{{`{{args.version}}`}}" # {{`...`}}
                      - name: CHART_VERSION
                        value: "{{`{{args.chartVersion}}`}}"
                      - name: GH_DISPATCH_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: {{ .Values.secrets.localSettings.ref }}
                            key: GH_DISPATCH_TOKEN
                            optional: true
                  {{- end }}
                restartPolicy: Never
