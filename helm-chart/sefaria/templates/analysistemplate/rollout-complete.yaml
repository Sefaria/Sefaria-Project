apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: rollout-complete-{{ .Values.deployEnv }}
  labels:
    deployEnv: "{{ .Values.deployEnv }}"
spec:
  args:
    - name: revision
    - name: deployment
    - name: version
    - name: chartVersion
  metrics:
    - name: healthcheck-ready
      provider:
        job:
          spec:
            backoffLimit: 1
            # No activeDeadlineSeconds here (deliberately -- see history
            # below). This Job is the AnalysisRun's metric provider, and the
            # AnalysisRun stays Running (blocking promotion) until the pod
            # completes; a Job deadline that gets exceeded turns the Job
            # Failed -> this AnalysisRun Failed -> blueGreen abort, which can
            # roll a healthy prod rollout back over nothing worse than a slow
            # Slack notification. Master never had this deadline. Both curls
            # below are already bounded per-call by --max-time/--connect-
            # timeout, and each container's own `|| /bin/true` guarantees the
            # pod still exits 0 even if a call hangs past those limits or
            # fails outright -- that's the real backstop, without the
            # rollback blast radius of a Job-level deadline.
            template:
              spec:
                containers:
                  - name: completion-message
                    image: curlimages/curl:8.11.1
                    command: [ "sh"]
                    args:
                      - -c
                      - >
                        curl
                        -X
                        POST
                        --max-time
                        30
                        --connect-timeout
                        10
                        --data-urlencode
                        'payload={"username": "Deployment Status", "text": "'$ENV' revision '$REVISION' has deployed version '$VERSION' using chart '$CHART_VERSION'", "icon_emoji": ":globe_with_meridians:"}'
                        $SLACK_URL
                        ||
                        /bin/true
                    env:
                      - name: REVISION
                        value: "{{`{{args.revision}}`}}" # {{`...`}}
                      - name: ENV   
                        value: "{{`{{args.deployment}}`}}" # {{`...`}}
                      - name: VERSION
                        value: "{{`{{args.version}}`}}" # {{`...`}}
                      - name: CHART_VERSION
                        value: "{{`{{args.chartVersion}}`}}"
                      # No channel override: the incoming webhook posts to its own configured channel.
                      - name: SLACK_URL
                        valueFrom:
                          secretKeyRef:
                            name: {{ .Values.secrets.localSettings.ref }}
                            key: SLACK_URL
                            optional: true
                  {{- if eq .Values.deployEnv "production" }}
                  # Prod-only (deployEnv "production" -- the prod HelmRelease sets
                  # deployEnv: production, not "prod"): relay the confirmed-healthy
                  # rollout to Sefaria-Project so a GitHub Actions workflow can generate
                  # and post full release notes. Fires only after Argo's own
                  # post-promotion analysis reaches this point, so it carries the same
                  # health guarantee as the Slack ping above. A missing or failing
                  # token/call must never fail the rollout itself.
                  #
                  # `version` is the load-bearing field in this payload: the receiving
                  # workflow derives the shipped commit range purely from prod/* git tags
                  # using this value (see .github/workflows/prod-release-notes.yaml).
                  # $VERSION is stripped of a leading "v" (e.g. v6.111.0-prod.1) right
                  # here before it goes into the payload, so repository_dispatch and
                  # workflow_dispatch always carry the same bare-version shape -- that's
                  # what lets the workflow's `concurrency.group` (keyed on the raw
                  # trigger value, evaluated before any step can normalize it) actually
                  # dedupe the two trigger paths for the same release. The workflow's own
                  # Resolve step still tolerates a leading "v" too, as a defensive
                  # fallback -- see .github/workflows/prod-release-notes.yaml.
                  #
                  # -sS -f plus --max-time/--connect-timeout: curl exits 0 on
                  # HTTP 401/403 by default, so without -f the `|| /bin/true`
                  # fallback would never fire for the most likely failure — a
                  # missing or bad dispatch token (GH_DISPATCH_TOKEN is
                  # optional, so absent is a live case). Without a timeout, a
                  # hung call to the GitHub API would otherwise leave this
                  # container hanging past what a healthy rollout needs.
                  - name: notify-github
                    image: curlimages/curl:8.11.1
                    command: [ "sh" ]
                    args:
                      - -c
                      - >
                        VERSION="${VERSION#v}";
                        curl
                        -sS
                        -f
                        --max-time
                        30
                        --connect-timeout
                        10
                        -X
                        POST
                        -H
                        "Authorization: token $GH_DISPATCH_TOKEN"
                        -H
                        "Accept: application/vnd.github+json"
                        https://api.github.com/repos/Sefaria/Sefaria-Project/dispatches
                        -d
                        '{"event_type":"prod-rollout-succeeded","client_payload":{"revision":"'$REVISION'","version":"'$VERSION'","chartVersion":"'$CHART_VERSION'"}}'
                        ||
                        /bin/true
                    env:
                      - name: REVISION
                        value: "{{`{{args.revision}}`}}" # {{`...`}}
                      - name: VERSION
                        value: "{{`{{args.version}}`}}" # {{`...`}}
                      - name: CHART_VERSION
                        value: "{{`{{args.chartVersion}}`}}"
                      # Deliberately NOT secrets.localSettings.ref: that secret is
                      # mounted via envFrom into every web/task/monitor/cronjob pod, and
                      # a GitHub PAT with write access to Sefaria-Project doesn't belong
                      # in that blast radius. See README-prod-release-notes.md.
                      - name: GH_DISPATCH_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: {{ .Values.secrets.ghDispatch.ref }}
                            key: GH_DISPATCH_TOKEN
                            optional: true
                  {{- end }}
                restartPolicy: Never
