# The Rollout as the sefaria chart renders it (name, labels, revision annotation, image) with the parts of the web pod
# template that matter to a one-off pod copied from it (premigrate.sh, preflight.sh --stage promote): a mounted
# local_settings.py (the Django settings of the fixture image, as in the real chart), a Secret-backed password, envFrom,
# a serviceAccount, imagePullSecrets, probes, ports and a pod anti-affinity that the copy must leave out. No Argo
# controller runs, so the Deployment below provides the running web pods (label app=web-<deployEnv>, container web).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.deployEnv }}-web
  labels:
    deployEnv: "{{ .Values.deployEnv }}"
    app: web-{{ .Values.deployEnv }}
  annotations:
    rollout.argoproj.io/revision: "{{ .Release.Revision }}"
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-{{ .Values.deployEnv }}}
  template:
    metadata:
      labels:
        app: web-{{ .Values.deployEnv }}
        tier: application
      annotations:
        ad.datadoghq.com/web.logs_exclude: "true"
    spec:
      serviceAccountName: {{ .Values.deployEnv }}-web
      imagePullSecrets:
        - name: {{ .Values.deployEnv }}-pull-secret
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - {key: app, operator: In, values: ["web-{{ .Values.deployEnv }}"]}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: {{ default .Values.web.image .Values.rolloutImage }}
          imagePullPolicy: Never
          args: ["python manage.py migrate && gunicorn sefaria.wsgi -b 0.0.0.0:80"]
          ports:
            - {containerPort: 80, protocol: TCP}
          startupProbe:
            httpGet: {path: /healthz-rollout, port: 80}
            failureThreshold: 40
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: 80}
          env:
            - {name: ENV_NAME, value: "{{ .Values.deployEnv }}"}
            - {name: DATABASES_USER, value: postgres}
            - name: DATABASES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.deployEnv }}-web-db, key: password}
            - {name: DATABASES_HOST, value: postgres-18.default.svc.cluster.local}
            - {name: DATABASES_PORT, value: "5432"}
            {{- if .Values.fixturePartial }}
            - {name: FIXTURE_PARTIAL_MIGRATE, value: "1"}
            {{- end }}
          envFrom:
            - configMapRef: {name: {{ .Values.deployEnv }}-web-env}
          volumeMounts:
            - mountPath: /app/sefaria/local_settings.py
              name: local-settings
              subPath: local_settings.py
              readOnly: true
      volumes:
        - name: local-settings
          configMap:
            name: {{ .Values.deployEnv }}-web-local-settings
            items:
              - {key: local_settings.py, path: local_settings.py}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.deployEnv }}-web
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.deployEnv }}-web-db
stringData:
  password: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployEnv }}-web-env
data:
  FIXTURE_ENV_MARKER: "copied-from-the-rollout"
---
# The settings the fixture image reads, mounted over its own file like the real chart's local-settings ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployEnv }}-web-local-settings
data:
  local_settings.py: |
    import os
    DATABASES = {
        "default": {
            "ENGINE": "django.db.backends.postgresql",
            "NAME": "sefaria_auth",
            "USER": os.getenv("DATABASES_USER"),
            "PASSWORD": os.getenv("DATABASES_PASSWORD"),
            "HOST": os.getenv("DATABASES_HOST"),
            "PORT": os.getenv("DATABASES_PORT"),
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployEnv }}-web-standin
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: web-{{ .Values.deployEnv }}}
  template:
    metadata:
      labels:
        app: web-{{ .Values.deployEnv }}
        {{- range $k, $v := .Values.web.podLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- range $k, $v := . }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: {{ .Values.web.image }}
          imagePullPolicy: Never
          command: ["sleep", "infinity"]
          env:
            - {name: PGHOST, value: postgres-18.default.svc.cluster.local}
            - {name: PGDATABASE, value: sefaria_auth}
            - {name: PGUSER, value: postgres}
            - {name: PGPASSWORD, value: postgres}
{{- if .Values.nginx.enabled }}
---
# nginx as watch-promotion.sh reads it: pods app=nginx-<deployEnv>, container nginx, one structured JSON access log line
# per request on stdout. Each line's status is the content of /tmp/status (default 200), so a test can turn on 5xx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployEnv }}-nginx-standin
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx-{{ .Values.deployEnv }}}
  template:
    metadata:
      labels: {app: nginx-{{ .Values.deployEnv }}}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              echo "nginx stand-in: starting (not an access log line)"
              while :; do
                s="$(cat /tmp/status 2>/dev/null || echo 200)"
                echo "{\"stackComponent\": \"nginx\", \"httpRequest\": {\"requestMethod\": \"GET\", \"requestUrl\": \"/api/texts/Genesis.1\", \"status\": $s, \"latency\": 0.012}}"
                sleep 0.05
              done
{{- end }}
