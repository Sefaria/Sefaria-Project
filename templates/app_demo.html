{% load static %}{% get_static_prefix as STATIC_PREFIX %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18345D">
<meta name="robots" content="noindex, nofollow">
<title>Sefaria App Demo</title>
<link rel="icon" type="image/svg+xml" href="{{ STATIC_PREFIX }}icons/library/favicon.svg?v=2" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Frank+Ruhl+Libre:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<style>
  @font-face { font-family: "Taamey Frank"; font-weight: normal; font-style: normal;
    src: url('{{ STATIC_PREFIX }}fonts/Taamey-Frank/TaameyFrankCLM-Medium.ttf'); }
  @font-face { font-family: "Taamey Frank"; font-weight: bold; font-style: normal;
    src: url('{{ STATIC_PREFIX }}fonts/Taamey-Frank/TaameyFrankCLM-Bold.ttf'); }
</style>
{% verbatim %}
<style>
  :root {
    --navy: #18345D;
    --navy-2: #1f4274;
    --blue: #4871bf;
    --ink: #1a1a1a;
    --ink-2: #555;
    --ink-3: #888;
    --line: #e5e5e5;
    --bg: #fbfbfa;
    --card: #ffffff;
    --gold: #ccb479;
    --gold-2: #b89a4f;
    --green: #2e7d5b;
    --tanakh: #004e5f;
    --mishnah: #5a99b7;
    --talmud: #ccb479;
    --halakhah: #802f3e;
    --liturgy: #ab4e66;
    --midrash: #5d956f;
    --musar: #7c406f;
    --radius: 14px;
    --serif: "EB Garamond", "adobe-garamond-pro", "Crimson Text", Georgia, serif;
    --hebrew: "Taamey Frank", "Frank Ruhl Libre", "Times New Roman", serif;
    --sans: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .he { font-family: var(--hebrew); direction: rtl; unicode-bidi: isolate; }
  .serif { font-family: var(--serif); }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .hidden { display: none !important; }

  /* ---------- App shell ---------- */
  .app { position: relative; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); margin: 0 auto; }
  .appbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--safe-t)) 16px 10px; background: #fff; border-bottom: 1px solid var(--line); }
  .wordmark { font-family: var(--serif); font-size: 25px; font-weight: 500; color: var(--navy); letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .wordmark .he-mark { font-family: var(--hebrew); font-size: 20px; color: var(--ink-3); font-weight: normal; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 500; font-size: 14px; }
  .avatar svg { width: 18px; height: 18px; }
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .panel { display: none; padding: 16px 16px 28px; }
  .panel.active { display: block; }
  .tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 6px 4px calc(6px + var(--safe-b)); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: .2px; }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: var(--navy); }

  h1.page { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.1; margin: 4px 0 2px; color: var(--ink); }
  .dateline { color: var(--ink-2); font-size: 14px; }
  .dateline .he { font-size: 15px; color: var(--ink-3); }
  h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-3); font-weight: 500; margin: 24px 0 10px; }

  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .stack > * + * { margin-top: 10px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 999px; font-weight: 500; font-size: 15px; transition: transform .08s ease, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn.secondary { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn.ghost { color: var(--navy); }
  .btn.block { width: 100%; }
  .btn.sm { height: 36px; padding: 0 14px; font-size: 14px; }
  .btn.gold { background: linear-gradient(135deg, #d8c28a, #b89a4f); color: #fff; }
  .btn svg { width: 18px; height: 18px; }
  .link { color: var(--blue); font-weight: 500; }

  /* ---------- Today ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .stat { padding: 14px; }
  .stat .label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
  .stat .big { font-family: var(--serif); font-size: 34px; line-height: 1; color: var(--ink); margin-top: 6px; display: flex; align-items: baseline; gap: 6px; }
  .stat .big small { font-family: var(--sans); font-size: 13px; color: var(--ink-2); }
  .stat .note { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .flame { color: #e0802c; width: 22px; height: 22px; align-self: center; }
  .ring { width: 48px; height: 48px; flex: none; }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .bg { stroke: #eceae4; }
  .ring .fg { stroke: var(--navy); stroke-linecap: round; transition: stroke-dashoffset .6s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .learned-btn { margin-top: 10px; width: 100%; }
  .learned-btn.done { background: #e8f3ee; color: var(--green); border-color: transparent; }

  .banner { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--radius); background: #f3efe4; border: 1px solid #e7dfc9; margin-top: 12px; }
  .banner .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #fff; color: var(--gold-2); flex: none; }
  .banner .ic svg { width: 20px; height: 20px; }
  .banner .t { font-weight: 500; font-size: 14px; }
  .banner .s { font-size: 13px; color: var(--ink-2); }
  .banner.shabbat { background: linear-gradient(135deg, #1d3a66, #18345D); color: #fff; border: 0; }
  .banner.shabbat .s { color: #c9d4e6; }
  .banner.shabbat .ic { background: rgba(255,255,255,.12); color: #f5d98b; }

  .preview-cta { margin-top: 12px; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--radius); background: var(--navy); color: #fff; box-shadow: 0 6px 18px rgba(24,52,93,.25); }
  .preview-cta .ic { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
  .preview-cta .ic svg { width: 22px; height: 22px; }
  .preview-cta .t { font-weight: 500; font-size: 16px; }
  .preview-cta .s { font-size: 13px; color: #c9d4e6; }
  .preview-cta .chev { margin-left: auto; opacity: .7; }

  .lcard { display: block; position: relative; overflow: hidden; padding: 14px 16px 14px 20px; }
  .lcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c, var(--navy)); }
  .lcard .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-3); font-weight: 500; display: flex; justify-content: space-between; }
  .lcard .title { font-family: var(--serif); font-size: 23px; line-height: 1.15; margin-top: 4px; color: var(--ink); }
  .lcard .trow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .lcard .trow .title { margin-top: 0; }
  .lcard .htitle { font-family: var(--hebrew); font-size: 20px; color: var(--ink-2); direction: rtl; text-align: right; white-space: nowrap; }
  .lcard .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .lcard .meta .go { color: var(--blue); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
  .lcard .desc { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .skeleton { background: linear-gradient(90deg, #f0efeb 0%, #f7f6f3 50%, #f0efeb 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius); height: 104px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .error-card { text-align: center; padding: 22px 16px; }
  .error-card .t { font-family: var(--serif); font-size: 20px; }

  /* ---------- Goals ---------- */
  .goal-hero { padding: 18px 16px; }
  .goal-hero .goal-title { font-family: var(--serif); font-size: 24px; line-height: 1.2; }
  .bar { height: 10px; border-radius: 999px; background: #eceae4; overflow: hidden; margin-top: 12px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--navy), var(--blue)); border-radius: inherit; transition: width .6s ease; }
  .bar-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .streak-card { display: flex; align-items: center; gap: 14px; }
  .streak-num { font-family: var(--serif); font-size: 44px; line-height: 1; color: var(--ink); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; text-align: center; }
  .week .d { font-size: 11px; color: var(--ink-3); }
  .week .dot { width: 30px; height: 30px; margin: 4px auto 0; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: #f1efea; color: var(--ink-3); }
  .week .dot.on { background: var(--navy); color: #fff; }
  .week .dot.rest { background: #f3efe4; color: var(--gold-2); }
  .week .dot.today { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--blue); }
  .week .dot svg { width: 14px; height: 14px; }
  .note-line { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
  .note-line svg { width: 16px; height: 16px; color: var(--gold-2); flex: none; margin-top: 1px; }
  .badges { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .badges::-webkit-scrollbar { display: none; }
  .badge { flex: none; width: 76px; text-align: center; font-size: 11px; color: var(--ink-2); }
  .badge .medal { width: 60px; height: 60px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 30% 30%, #f3e7c3, #ccb479 70%); color: #6b5520; box-shadow: inset 0 0 0 3px rgba(255,255,255,.5), 0 2px 6px rgba(0,0,0,.08); }
  .badge .medal svg { width: 26px; height: 26px; }
  .badge.locked .medal { background: #efeee9; color: #b9b7b0; box-shadow: inset 0 0 0 2px #fff; }
  .log-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0efeb; }
  .log-item:last-child { border-bottom: 0; }
  .log-item .when { width: 46px; flex: none; text-align: center; }
  .log-item .when b { display: block; font-family: var(--serif); font-size: 20px; line-height: 1; font-weight: 500; }
  .log-item .when span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; }
  .log-item .mins { font-size: 13px; color: var(--ink-2); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #eef2f9; color: var(--navy); font-weight: 500; }
  .chip.demo { background: #f3efe4; color: #8a7340; }

  .seg { display: flex; background: #f1efea; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; height: 34px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .seg button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 500; }
  select, input[type=date], input[type=text], input[type=time], textarea { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid #d9d7d0; border-radius: 10px; background: #fff; color: var(--ink); appearance: none; -webkit-appearance: none; }
  textarea { resize: none; line-height: 1.4; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #d9d7d0; background: #fff; font-size: 14px; color: var(--ink); }
  .pill.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ---------- Share ---------- */
  .share-card { position: relative; border-radius: 18px; padding: 22px 20px 18px; color: #fff; overflow: hidden; background: radial-gradient(120% 90% at 100% 0%, #2d5aa0 0%, #18345D 55%, #10233f 100%); box-shadow: 0 10px 24px rgba(24,52,93,.28); }
  .share-card::after { content: "א"; position: absolute; right: -14px; bottom: -58px; font-family: var(--hebrew); font-size: 210px; line-height: 1; color: rgba(255,255,255,.06); }
  .share-card .brand { font-family: var(--serif); font-size: 18px; opacity: .9; }
  .share-card .quote { font-family: var(--serif); font-size: 27px; line-height: 1.18; margin: 18px 0 16px; position: relative; z-index: 1; }
  .share-card .foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #c9d4e6; position: relative; z-index: 1; }
  .share-card .who { display: flex; align-items: center; gap: 8px; }
  .share-card .who .avatar { width: 28px; height: 28px; font-size: 12px; background: #f5d98b; color: var(--navy); }
  .share-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .share-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .share-btn .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .share-btn .ic svg { width: 20px; height: 20px; }
  .friend { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0efeb; }
  .friend:last-child { border-bottom: 0; }
  .friend .avatar { background: #e9eef7; color: var(--navy); }

  /* ---------- Text (portrait) ---------- */
  .text-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .text-head .ref { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
  .text-head .heref { font-family: var(--hebrew); font-size: 18px; color: var(--ink-3); }
  .rotate-hint { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; padding: 10px 12px; border-radius: 12px; background: #eef2f9; color: var(--navy); font-size: 13px; }
  .rotate-hint svg { width: 22px; height: 22px; flex: none; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%, 40% { transform: rotate(0); } 60%, 90% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  .verses { margin-top: 10px; }
  .verse { padding: 12px 4px; border-bottom: 1px solid #f0efeb; position: relative; border-radius: 8px; transition: background .2s; }
  .verse .num { position: absolute; left: 4px; top: 14px; font-size: 11px; color: var(--ink-3); font-family: var(--sans); }
  .verse .v-he { font-family: var(--hebrew); direction: rtl; text-align: right; font-size: calc(22px * var(--ts, 1)); line-height: 1.6; color: var(--ink); padding-left: 22px; }
  .verse .v-en { font-family: var(--serif); font-size: calc(18px * var(--ts, 1)); line-height: 1.45; color: #333; padding-left: 22px; margin-top: 4px; }
  .verse.hl { background: #fdf6e0; }
  .lang-he .v-en, .lang-en .v-he { display: none; }
  .lang-en .v-en { margin-top: 0; }

  /* ---------- Side by side (landscape) ---------- */
  .sbs { display: none; }
  .app.landscape.tab-text .appbar, .app.landscape.tab-text .tabbar { display: none; }
  .app.landscape.tab-text #panel-text > .portrait { display: none; }
  .app.landscape.tab-text #panel-text { padding: 0; }
  .app.landscape.tab-text .sbs { display: block; }
  .sbs-bar { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 10px 20px; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); font-size: 13px; }
  .sbs-bar .mode { color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .sbs-bar .mode b { color: var(--navy); font-weight: 500; }
  .sbs-bar .mode button { color: var(--navy); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #f1efea; }
  .sbs-bar .mode button svg { width: 16px; height: 16px; }
  .sbs-bar .center { font-family: var(--serif); font-size: 18px; color: var(--ink); text-align: center; white-space: nowrap; }
  .sbs-bar .center .he { font-size: 16px; color: var(--ink-3); margin-left: 8px; }
  .sbs-bar .aa { justify-self: end; font-family: var(--serif); font-size: 20px; color: var(--navy); width: 40px; height: 32px; border-radius: 8px; background: #f1efea; }
  .sbs-rows { padding: 6px 20px 24px; max-width: 1100px; margin: 0 auto; }
  .sbs-row { display: grid; grid-template-columns: 1fr 34px 1fr; gap: 14px; padding: 12px 10px; border-radius: 10px; border-bottom: 1px solid #f0efeb; cursor: pointer; transition: background .2s; }
  .sbs-row .en { font-family: var(--serif); font-size: calc(18px * var(--ts, 1)); line-height: 1.45; color: #333; }
  .sbs-row .n { text-align: center; font-size: 12px; color: var(--ink-3); padding-top: 4px; }
  .sbs-row .hb { font-family: var(--hebrew); direction: rtl; text-align: right; font-size: calc(21px * var(--ts, 1)); line-height: 1.55; }
  .sbs-row.hl { background: #fdf6e0; border-bottom-color: transparent; }
  .sbs-row.hl .n { color: var(--gold-2); font-weight: 700; }

  /* ---------- Overlays ---------- */
  .overlay { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #fff; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet-backdrop { position: absolute; inset: 0; z-index: 60; background: rgba(15,25,45,.4); animation: fadeIn .2s ease; display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: #fff; border-radius: 20px 20px 0 0; padding: 10px 18px calc(22px + var(--safe-b)); animation: sheetUp .28s cubic-bezier(.2,.9,.3,1); max-height: 88%; overflow-y: auto; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #ddd; margin: 0 auto 14px; }
  .sheet h3 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 4px; }
  .menu-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 0; border-bottom: 1px solid #f0efeb; text-align: left; font-size: 15px; }
  .menu-item .v { color: var(--ink-3); font-size: 14px; }
  .menu-item.danger { color: var(--halakhah); }

  /* Onboarding */
  .ob { background: var(--bg); }
  .ob-top { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + var(--safe-t)) 16px 6px; min-height: 52px; }
  .ob-back { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
  .ob-back svg { width: 22px; height: 22px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 4px; background: #d8d6cf; transition: all .25s; }
  .dots i.on { width: 22px; background: var(--navy); }
  .dots i.done { background: #8fa3c4; }
  .skip { color: var(--ink-2); font-size: 15px; font-weight: 500; padding: 8px 4px; min-width: 36px; text-align: right; }
  .ob-body { flex: 1; overflow-y: auto; padding: 8px 20px 16px; animation: stepIn .3s ease; }

    else if (act === 'ob-back') { if (ob.i > 0) { ob.i--; renderOb(); } }
    else if (act === 'signin') { S.signedIn = true; save(); toast('Signed in (demo)'); finishOnboarding(); }
    else if (act === 'widget') toast('In the app, this adds a Sefaria widget to your home screen');
    else if (act === 'chat-send') chatFree();
  }
  function renderDots() {
    var steps = obSteps();
    $('.dots', ob.el).innerHTML = steps.map(function (s, i) { return '<i class="' + (i === ob.i ? 'on' : i < ob.i ? 'done' : '') + '"></i>'; }).join('');
  }
  function onObChange(e) {
    var t = e.target;
    if (t.hasAttribute('data-toggle')) { S.reminders[t.getAttribute('data-toggle')] = t.checked; save(); }
    if (t.getAttribute('data-f') === 'time' && t.value) { S.reminders.time = t.value; save(); }
    if (t.getAttribute('data-f') === 'goaltext') { S.goal.text = t.value; save(); }
    if (t.id === 'chatInput' && e.type === 'change') chatFree();
  }

  /* ---------- Scripted guide chat (no network calls) ---------- */
  var REPLIES = [
    { id: 'ethics', text: 'I want something short to learn each morning about Jewish ethics' },
    { id: 'parasha', text: 'I’d like to follow the weekly Torah portion' },
    { id: 'talmud', text: 'I’m curious about Talmud but don’t know where to begin' },
    { id: 'surprise', text: 'Not sure yet — surprise me' }
  ];
  var ANSWERS = {
    ethics: { say: 'Pirkei Avot — Ethics of the Fathers — is a great fit. It’s a collection of short teachings on how to live: kindness, humility, study, and community. One mishnah a day takes about two minutes.',
      card: { add: 'avot', t: 'Pirkei Avot', s: 'One mishnah a day · ~2 min', c: 'var(--musar)', q: '“The world stands on three things: on Torah, on service, and on acts of lovingkindness.” — Avot 1:2' } },
    parasha: { say: 'Following the parashah connects you with Jews everywhere reading the same portion each Shabbat. I’ll send it to you in small pieces through the week.',
      card: { add: 'parasha', t: 'Parashat Hashavua', s: 'The weekly Torah portion · ~10 min a day', c: 'var(--tanakh)' } },
    talmud: { say: 'Daf Yomi is a big commitment — about 45 minutes a day. Many people start with Mishnah Yomit instead: two short mishnayot a day, and it’s the foundation the Talmud builds on.',
      card: { add: 'mishnah', t: 'Mishnah Yomit', s: 'Two mishnayot a day · ~10 min', c: 'var(--mishnah)' } },
    surprise: { say: 'How about Tehillim? The Book of Psalms is divided into a monthly cycle — a few psalms a day, and the whole book every month. Beautiful to read, in Hebrew or English.',
      card: { add: 'tehillim', t: 'Tehillim', s: 'The monthly cycle · ~15 min', c: 'var(--liturgy)' } }
  };
  function startChat() {
    ob.chat = ob.chat || { used: {}, log: [] };
    var chat = $('#chat');
    if (ob.chat.log.length) { chat.innerHTML = ob.chat.log.join(''); $$('.replies', chat).forEach(function (r) { r.remove(); }); showReplies(true); return; }
    botSay('Hi! I’m your Sefaria learning guide.', null, function () {
      botSay('What brings you to Jewish learning? Pick one below, or type your own.', null, function () { showReplies(); });
    });
  }
  function scrollChat() { var b = $('#obBody'); if (b) b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); }
  function pushChat(html) { var chat = $('#chat'); if (!chat) return; chat.insertAdjacentHTML('beforeend', html); ob.chat.log.push(html); scrollChat(); }
  function botSay(text, card, then) {
    var chat = $('#chat'); if (!chat) return;
    var typing = document.createElement('div');
    typing.className = 'bot-row';
    typing.innerHTML = '<span class="logo-tile">ס</span><div class="msg bot typing"><i></i><i></i><i></i></div>';
    chat.appendChild(typing); scrollChat();
    setTimeout(function () {
      typing.remove();
      pushChat('<div class="bot-row"><span class="logo-tile">ס</span><div class="msg bot">' + esc(text) + '</div></div>');
      if (card) {
        var added = S.cycles.indexOf(card.add) >= 0;
        pushChat('<div class="suggest-card" style="--c:' + card.c + '"><div class="top"><div class="t">' + esc(card.t) + '</div><div class="s">' + esc(card.s) + '</div>' +
          (card.q ? '<blockquote>' + esc(card.q) + '</blockquote>' : '') + '</div>' +
          '<div class="act"><button class="btn ' + (added ? 'secondary' : 'primary') + ' sm block" data-add="' + card.add + '"' + (added ? ' disabled' : '') + '>' + (added ? I.check + ' Added to my learning' : 'Add to my learning') + '</button></div></div>');
      }
      if (then) setTimeout(then, 250);
    }, Math.min(1500, 650 + text.length * 6));
  }
  function showReplies(noAnim) {
    var chat = $('#chat'); if (!chat) return;
    var left = REPLIES.filter(function (r) { return !ob.chat.used[r.id]; });
    var html = '<div class="replies">' + left.map(function (r) { return '<button class="reply" data-reply="' + r.id + '">' + esc(r.text) + '</button>'; }).join('') +
      (Object.keys(ob.chat.used).length ? '<button class="reply" data-act="ob-next" style="border-style:dashed">That’s all for now →</button>' : '') + '</div>';
    chat.insertAdjacentHTML('beforeend', html);
    if (!noAnim) scrollChat();
  }
  function chatReply(id) {
    var r = REPLIES.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    ob.chat.used[id] = 1;
    $$('.replies', $('#chat')).forEach(function (x) { x.remove(); });
    pushChat('<div class="msg me">' + esc(r.text) + '</div>');
    var a = ANSWERS[id];
    setTimeout(function () { botSay(a.say, a.card); }, 300);
  }
  function chatFree() {
    var inp = $('#chatInput'); if (!inp || !inp.value.trim()) return;
    var v = inp.value.trim(); inp.value = '';
    $$('.replies', $('#chat')).forEach(function (x) { x.remove(); });
    pushChat('<div class="msg me">' + esc(v) + '</div>');
    var id = /ethic|moral|morning|short|avot|kind/i.test(v) ? 'ethics' : /parash|portion|torah|weekly/i.test(v) ? 'parasha' : /talmud|gemara|daf|mishn/i.test(v) ? 'talmud' : 'surprise';
    ob.chat.used[id] = 1;
    setTimeout(function () { botSay(ANSWERS[id].say, ANSWERS[id].card); }, 300);
  }

  /* ======================================================================
     Tabs, events, orientation
     ====================================================================== */
  var currentTab = 'today';
  function switchTab(t) {
    currentTab = t;
    $$('.tab').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === t); });
    $$('.panel').forEach(function (p) { p.classList.toggle('active', p.id === 'panel-' + t); });
    var app = $('#app'); ['today', 'goals', 'share', 'text'].forEach(function (x) { app.classList.toggle('tab-' + x, x === t); });
    if (t !== 'share') shareOverride = null;
    if (t === 'share') renderShare();
    $('#main').scrollTop = 0;
  }
  function renderAll() {
    $('#avatarBtn').innerHTML = S.signedIn ? 'M' : I.user;
    renderToday(); renderGoals(); renderShare(); renderText();
  }
  var forcedRotate = false;
  var mq = window.matchMedia('(orientation: landscape) and (max-height: 600px)');
  function applyOrientation() { $('#app').classList.toggle('landscape', mq.matches || forcedRotate); }
  if (mq.addEventListener) mq.addEventListener('change', applyOrientation); else if (mq.addListener) mq.addListener(applyOrientation);
  window.addEventListener('resize', applyOrientation);

  iconize(document);
  $('#tabbar').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) switchTab(b.getAttribute('data-tab')); });
  $('#avatarBtn').addEventListener('click', openSettings);
  $('#rotateBtn').addEventListener('click', function () { forcedRotate = !forcedRotate; $('#app').classList.toggle('rotated', forcedRotate); applyOrientation(); });
  $('#main').addEventListener('click', function (e) {
    var a = e.target.closest('[data-act],[data-share],[data-seg] button,[data-pills] button,.verse,.sbs-row');
    if (!a) return;
    if (a.classList.contains('verse') || a.classList.contains('sbs-row')) {
      var n = +a.getAttribute('data-v'); hlVerse = hlVerse === n ? null : n;
      $$('.verse,.sbs-row', $('#panel-text')).forEach(function (r) { r.classList.toggle('hl', +r.getAttribute('data-v') === hlVerse); });
      return;
    }
    if (a.hasAttribute('data-share')) { doShare(a.getAttribute('data-share')); return; }
    var seg = a.parentNode && a.parentNode.getAttribute && (a.parentNode.getAttribute('data-seg') || a.parentNode.getAttribute('data-pills'));
    if (seg) {
      var v = a.getAttribute('data-v');
      if (seg === 'lang') { S.lang = v; save(); renderText(); renderToday(); return; }
      if (seg === 'gtype') { draftGoal = v === 'minutes' ? { type: 'minutes', minutes: draftGoal.minutes || 10 } : v === 'finish' ? { type: 'finish', book: draftGoal.book || 'Berakhot', by: draftGoal.by || 'pesach', done: draftGoal.done || 0 } : { type: 'custom', text: draftGoal.text || '' }; renderGoals(); return; }
      if (seg === 'minutes') { draftGoal.minutes = +v; renderGoals(); return; }
      if (seg === 'by') { draftGoal.by = v; renderGoals(); return; }
    }
    var act = a.getAttribute('data-act');
    if (act === 'learned') learnedToday();
    else if (act === 'lock') openLock();
    else if (act === 'siyum') openSiyum();
    else if (act === 'retry') boot();
    else if (act === 'goal-edit') { editingGoal = true; draftGoal = clone(S.goal); renderGoals(); }
    else if (act === 'goal-cancel') { editingGoal = false; renderGoals(); }
    else if (act === 'goal-save') {
      var f = $('#panel-goals');
      $$('[data-f]', f).forEach(function (inp) { draftGoal[inp.getAttribute('data-f')] = inp.value; });
      if (draftGoal.type === 'finish' && draftGoal.book !== S.goal.book) draftGoal.done = 0;
      S.goal = draftGoal; editingGoal = false; save(); renderAll(); toast('Goal saved');
    }
    else if (act === 'native-share') doShare('native');
    else if (act === 'cheer') toast('Sent a “yasher koach” to ' + a.getAttribute('data-name'));
    else if (act === 'aa') { var sc = [1, 1.15, 1.3, 0.9], i = sc.indexOf(S.textScale || 1); S.textScale = sc[(i + 1) % sc.length]; save(); $('#panel-text').style.setProperty('--ts', S.textScale); }
    else if (act === 'exit-sbs') { if (forcedRotate) { forcedRotate = false; $('#app').classList.remove('rotated'); applyOrientation(); } else switchTab('today'); }
  });
  $('#main').addEventListener('change', function (e) {
    var t = e.target;
    if (editingGoal && t.getAttribute('data-f') === 'book') { draftGoal.book = t.value; }
    if (editingGoal && t.getAttribute('data-f') === 'byDate') { draftGoal.byDate = t.value; }
  });

  function boot() {
    CAL_LOADING = true; CAL_ERR = null; PASSAGE = null; PASSAGE_ERR = null;
    renderAll();
    loadCalendar().then(function () {
      renderAll();
      if (ob && obSteps()[ob.i] === 'remind') renderOb();
      return loadPassage();
    }).then(function () { renderText(); });
  }
  var startTab = qs.get('tab');
  switchTab(['today', 'goals', 'share', 'text'].indexOf(startTab) >= 0 ? startTab : 'today');
  applyOrientation();
  if (S.onboarded) seedDemoHistory();
  boot();
  if (!S.onboarded) startOnboarding();
})();
</script>
</body>
</html>
