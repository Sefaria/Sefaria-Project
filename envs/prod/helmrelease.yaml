apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: production
  namespace: default
spec:
  interval: 5m
  timeout: 30m
  chart:
    spec:
      chart: sefaria
      version: "0.92.1-prod.1"
      sourceRef:
        kind: HelmRepository
        name: sefaria-project
        namespace: flux-system
  values:
    sandbox: "false"
    contentSandbox: "false"
    deployEnv: production
    previousServicesCount: "3"
    deploymentMessage: true
    postgres:
      host: "postgres-18.default.svc.cluster.local"
    restore:
      enabled: false
      dynamicName: false
      cleanup: false
    backup:
      mongo:
        enabled: true
        prefix: ""
        public: true
        bucket: sefaria-mongo-backup
        archiveBucket: sefaria-mongo-archive
        serviceAccount: database-backup-write
      postgres:
        enabled: true
        version: 18.3
        prefix: ""
        bucket: sefaria-user-backup
        serviceAccount: database-backup-write
      sitemaps:
        enabled: true
    web:
      containerImage:
        imageRegistry: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-web
        tag: "v7.9.2-prod.1"
      replicaCount: 7
      resources:
        web:
          gunicornWorkerCount: 3
          gunicornThreadCount: 8
          resources:
            requests:
              memory: "14Gi"
              cpu: "1500m"
            limits:
              memory: "18Gi"
              cpu: "3"
      secrets:
        googleClient:
          ref: google-client-secret-production
        logging:
          ref: logging-secret-production
        schoolLookup:
          ref: school-lookup-data-production
    nameService:
      enabled: true
      replicaCount: 2
      resources:
        resources:
          requests:
            memory: "3.4Gi"
            cpu: "200m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
    gpuServer: "gpu-server.gpu-server.svc.cluster.local"
    nodejs:
      containerImage:
        imageRegistry: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-node
        tag: "v7.9.2-prod.1"
      replicaCount: 4
      resources:
        requests:
          memory: "1Gi"
          cpu: "1"
        limits:
          memory: "1500Mi"
          cpu: "1500m"
      heapSize: 1250
    varnish:
      logging: {}
      replicaCount: 1
      resources:
        requests:
          memory: "17Gi"
          cpu: "1"
        limits:
          memory: "18Gi"
          cpu: "1500m"
      tuning:
        malloc: "14440m"
        nuke_limit: "400"
        thread_pools: 2
        thread_pool_max: 5000
        thread_pool_min: 100
        first_byte_timeout: 60
        between_bytes_timeout: 60
      secrets:
        varnish:
          ref: varnish-secret-production
      monitoring:
        enabled: true
    tasks:
      enabled: true
      resources:
        requests:
          memory: "6Gi"
          cpu: "200m"
        limits:
          memory: "8Gi"
          cpu: "1000m"
      replicaCount: 7
      redis:
        url: ""
        port: "26379"
        brokerDBNumber: 2
        resultBackendDBNumber: 3
        sentinelURL: "redis-headless.redis.svc.cluster.local"
        transportOptions:
          master_name: mymaster
        redisPassword:
          ref: redis-password
        sentinelPassword:
          ref: sentinel-password
      queues:
        llm: llm-llm
      findRefs:
        enabled: true
        replicaCount: 2
    domains:
      root:
        - url: "sefaria.org"
          cert: "origin-tls-prod2"
          language: english
          code:
            - en
        - url: "sefaria.org.il"
          cert: "origin-il-tls-prod2"
          language: hebrew
          code:
            - he
      modules:
        - name: voices
          subdomains:
            en: voices
            he: chiburim
          redirects:
            - sheets
            - collections
            - profile
    gateway:
      enabled: true
      alpnProtocols:
        - h2
        - http/1.1
      annotations: {}
    ingress:
      enabled: false
    # API Key Program authService (Phase 1). Ships disabled: merging this must not change what this environment runs.
    # Enabling it attaches an ext_authz SecurityPolicy to the HTTPRoute (the preprod pass: projects/api-key-program/preprod-pass).
    authService:
      # Flip to true only at the prod switch, after the preprod pass (observe first). Also turns on the HTTPS-only redirect and the x-sefaria-* header strip.
      enabled: false
      # observe: never denies; records what would be rejected in x-sefaria-auth-result. enforce only after the preprod pass.
      mode: observe
      replicaCount: 1
      image:
        # Release image, built by scripts/release-prepare.sh; deploy-static.yaml writes the tag on each release.
        repository: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-auth-service
        tag: ""
      extAuth:
        # Fail open: if the auth service is down or slower than the timeout, the request goes through as the anonymous tier.
        failOpen: true
        timeout: 200ms
      postgres:
        secrets:
          dsn:
            # Name only. The Secret lives in infrastructure (prod-common-secrets), shared by default and preprod namespaces.
            ref: auth-service-registry
            key: AUTH_PG_DSN
      rateLimit:
        # Needs the controller rateLimit backend (infrastructure repo) first.
        enabled: false
      nginxLogFields: true
      monitoring:
        enabled: true
    nginx:
      containerImage:
        imageRegistry: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-asset
        tag: "v7.9.2-prod.1"
      SEARCH_HOST: "elasticsearch-1b-es-http.elasticsearch.svc"
      SEARCH_PORT: "9200"
      SEARCH_PATH: ""
      SEARCH_SSL_ENABLE: false
      disableScraping: false
      replicaCount: 2
      resources:
        requests:
          memory: "200Mi"
          cpu: "100m"
        limits:
          memory: "300Mi"
          cpu: "150m"
    export:
      enabled: true
    cronJobs:
      regenerate:
        enabled: true
      dailyEmailNotifications:
        enabled: true
      indexFromQueue:
        enabled: true
      metrics:
        enabled: true
      nationBuilderSync:
        enabled: false
      rambiWebpagesWeekly:
        enabled: true
      reindexElasticSearch:
        enabled: true
        allowSharedIndex: true
      topicsIndexing:
        enabled: true
      trello:
        enabled: true
      trends:
        enabled: true
      weeklyEmailNotifications:
        enabled: true
      buildTopNGramsForSearchAutocorrect:
        enabled: true
    secrets:
      localSettings:
        ref: local-settings-secrets-production
      backupManager:
        ref: backup-manager-secret-production
      # Must exist (SOPS-encrypted) for the prod-release-notes pipeline to
      # actually fire -- with optional: true on the secretKeyRef, a missing
      # Secret here is a SILENT no-op, not an error. See
      # build/ci/README-prod-release-notes.md.
      ghDispatch:
        ref: gh-dispatch-token-production
    instrumentation:
      enabled: false
      otelEndpoint: "http://otel-collector-collector.monitoring:4317"
      jaegerEndpoint: "jaeger-agent-dev.monitoring.svc.cluster.local:6831"
    datadog:
      enabled: true
    localSettings:
      DEBUG: false
      OFFLINE: false
      MONGO_HOST: "mongo"
      APSCHEDULER_NAME: "apscheduler-production"
      USE_CLOUDFLARE: false
      FRONT_END_URL: "http://www.sefaria.org"
      DOWN_FOR_MAINTENANCE: false
      MAINTENANCE_MESSAGE: "Sefaria is down for scheduled maintenance. We expect to be back online within 15 minutes. Thank you for your patience."
      GLOBAL_WARNING: false
      GLOBAL_WARNING_MESSAGE: "Sefaria will be in <b>Read-Only</b> mode for scheduled maintenance from 4:45pm-6:45pm Pacific time. Edits will <b>not</b> be saved during that time."
      SITE_PACKAGE: "sites.sefaria"
      DEFAULT_FROM_EMAIL: "Sefaria <hello@sefaria.org>"
      SERVER_EMAIL: "dev@sefaria.org"
      CRM_TYPE: "SALESFORCE"
      FAIL_GRACEFULLY: "True"
      SESSION_COOKIE_DOMAIN: ".sefaria.org"
      SESSION_COOKIE_SECURE: true
      SESSION_COOKIE_HTTPONLY: true
      SESSION_COOKIE_SAMESITE: "Lax"
      CSRF_COOKIE_SECURE: true
      CSRF_COOKIE_HTTPONLY: false
      CSRF_COOKIE_SAMESITE: "Lax"
      DEVELOPER_SETTINGS_ENABLED: "False"
      DEVELOPER_SETTINGS_MOCKS: "False"
