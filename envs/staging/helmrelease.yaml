apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sefariastaging
  namespace: default
spec:
  interval: 5m
  timeout: 30m
  chart:
    spec:
      chart: sefaria
      version: "0.92.1"
      sourceRef:
        kind: HelmRepository
        name: sefaria-project-helm-repo
        namespace: default
      interval: 1m
  upgrade:
    remediation:
      remediateLastFailure: false
  values:
    sandbox: "true"
    contentSandbox: "true"
    deployEnv: sefariastaging
    previousServicesCount: "1"
    rollouts:
      prePromotionAnalysis: false
    restore:
      enabled: true
    web:
      containerImage:
        imageRegistry: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-web
        tag: "v7.10.1"
      resources:
        web:
          resources:
            requests:
              memory: "8Gi"
              cpu: "4000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
      secrets:
        googleClient:
          ref: google-client-secret
        logging:
          ref: logging-secret
        schoolLookup:
          ref: school-lookup-data
    redis:
      containerImage:
        imageRegistry: redis
        tag: latest
    nodejs:
      containerImage:
        imageRegistry: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-node
        tag: "v7.10.1"
      resources:
        requests:
          memory: "400Mi"
          cpu: "400m"
        limits:
          memory: "512Mi"
          cpu: "400m"
      heapSize: 300
    varnish:
      secrets:
        varnish:
          ref: varnish-secret-helm
    ingress:
      enabled: false
    gateway:
      enabled: true
      alpnProtocols:
        - h2
        - http/1.1
    # API Key Program authService (Phase 1). Ships disabled: merging this must not change what this environment runs.
    # The block must exist here: deploy-static.yaml writes authService.image.tag into whichever env file is deploying, and
    # without a repository here the chart default (a development-registry repo, where release tags do not exist) would be used.
    authService:
      # Flip to true only after staging is deliberately included in the rollout. Before flipping, two things must be true:
      #  1. A release has run first: deploy-static.yaml writes authService.image.tag, and that tag must exist in the registry.
      #     Flipping enabled alone fails rendering (image.tag is empty and required).
      #  2. The Secret auth-service-registry (key AUTH_PG_DSN) exists in this release's namespace. This HelmRelease sets no
      #     targetNamespace, so that is its own namespace (default); not verified against the cluster.
      enabled: false
      # observe: never denies; records what would be rejected in x-sefaria-auth-result.
      mode: observe
      replicaCount: 1
      image:
        # Release image, built by scripts/release-prepare.sh; deploy-static.yaml writes the tag on each release.
        repository: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-auth-service
        tag: ""
      extAuth:
        # Fail open: if the auth service is down or slower than the timeout, the request goes through as the anonymous tier.
        failOpen: true
        timeout: 200ms
      postgres:
        secrets:
          dsn:
            # Name only. This Secret is not provisioned yet: before enabling, create auth-service-registry (key AUTH_PG_DSN)
            # via infrastructure in the namespace this release deploys to.
            ref: auth-service-registry
            key: AUTH_PG_DSN
      rateLimit:
        # Needs the controller rateLimit backend (infrastructure repo) first.
        enabled: false
      nginxLogFields: true
      monitoring:
        enabled: true
    nginx:
      containerImage:
        imageRegistry: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-asset
        tag: "v7.10.1"
    monitor:
      containerImage:
        imageRegistry: us-east1-docker.pkg.dev/production-deployment/containers/sefaria-web
        tag: "v7.10.0"
    datadog:
      enabled: true
    tasks:
      enabled: false
    postgres:
      db: "sefariastaging"
    domains:
      root:
        - url: "sefariastaging.org"
          cert: "sefariastaging-tls"
          language: english
          code:
            - en
        - url: "sefariastaging-il.org"
          cert: "sefariastaging-il-tls"
          language: hebrew
          code:
            - he
      modules:
        - name: voices
          subdomains:
            en: voices
            he: chiburim
          redirects:
            - sheets
            - collections
            - profile
    cronJobs:
      reindexElasticSearch:
        enabled: true
        allowSharedIndex: true
      syncPostgresProductionData:
        enabled: true
      syncMongoProductionData:
        enabled: true
    secrets:
      localSettings:
        ref: local-settings-secrets
      backupManager:
        ref: backup-manager
    localSettings:
      DEBUG: true
      DOMAIN_LANGUAGE:
        "https://sefariastaging.org": "english"
        "https://voices.sefariastaging.org": "english"
        "https://www.sefariastaging.org": "english"
        "https://sefariastaging-il.org": "hebrew"
        "https://chiburim.sefariastaging-il.org": "hebrew"
        "https://www.sefariastaging-il.org": "hebrew"
      DOMAIN_MODULES:
        en:
          library: "https://www.sefariastaging.org"
          voices: "https://voices.sefariastaging.org"
        he:
          library: "https://www.sefariastaging-il.org"
          voices: "https://chiburim.sefariastaging-il.org"
      MONGO_HOST: "mongo"
      APSCHEDULER_NAME: "apscheduler-{{ .Values.deployEnv }}"
      SEARCH_ADMIN: "http://elasticsearch-data:9200"
      TURN_SERVER: ""
      USE_CLOUDFLARE: false
      FRONT_END_URL: "http://sefariastaging.org"
      OFFLINE: false
      DOWN_FOR_MAINTENANCE: false
      MAINTENANCE_MESSAGE: "Sefaria is down for scheduled maintenance. We expect to be back online within 15 minutes. Thank you for your patience."
      GLOBAL_WARNING: false
      GLOBAL_WARNING_MESSAGE: "Sefaria will be in <b>Read-Only</b> mode for scheduled maintenance from 4:45pm-6:45pm Pacific time. Edits will <b>not</b> be saved during that time."
